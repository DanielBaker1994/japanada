<script>

/* ════ engine.js ════ */
'use strict';
/* ── Halfway · engine ──────────────────────────────────────────────────────────
   A 1920×1080 live-plate risograph compositor, adapted from the riso-windowseat
   kit (github.com/sevenevesai/riso-windowseat, MIT) for a wide frame.

   Every frame draws continuous ink coverage for six plates. Coverage is packed
   into the RGB channels of two canvases (A: yellow, pink, orange; B: blue,
   green, indigo) that share one alpha, so ordinary source-over compositing is
   the kit's `put` for three plates at once: a shape owns its value on every
   plate it touches. 'screen' adds ink toward full coverage (an overprint),
   'multiply' removes a fraction of it (a partial knockout).

   compose() then thresholds each plate per pixel against a page-pinned screen
   table (dot distance field, low-frequency mottling, starvation flecks), with
   a fixed registration miss per plate, and multiplies the inks onto a baked
   cream paper. Gradients print as dot size; the screen never swims.         */

const W = 1920, H = 1080, FPS = 30, DUR = 15;
const PAD = 4, PW = W + PAD * 2, PH = H + PAD * 2;
const PITCH = 4.6;
const PAPER = '#F2EDE3';
const PLATES = ['yellow', 'pink', 'orange', 'blue', 'green', 'indigo'];
const INK = {
  yellow: '#FFE800', pink: '#FF48B0', orange: '#FF6C2F',
  blue: '#0078BF', green: '#00A95C', indigo: '#2E3192',
};
// Rational screen tangents b/a so the rotated lattice tiles seamlessly.
const SCREEN = {
  yellow: { a: 1, b: 0 },  //  0.0°
  pink:   { a: 1, b: 4 },  // 76.0°
  orange: { a: 2, b: 1 },  // 26.6°
  blue:   { a: 4, b: 1 },  // 14.0°
  green:  { a: 1, b: 2 },  // 63.4°
  indigo: { a: 1, b: 1 },  // 45.0°
};
// Each plate misses by a fixed amount (device px): the contours reveal it.
const REG = {
  yellow: [2, 1], pink: [-2, 2], orange: [1, 2],
  blue: [1, -1], green: [-1, -1], indigo: [0, 0],
};

/* ── deterministic randomness ─────────────────────────────────────────────── */
function mulberry32(a) {
  return function () {
    a = a + 0x6D2B79F5 | 0;

  return h >>> 0;
}
const rngFor = (key) => mulberry32(hash(key));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, u) => a + (b - a) * u;
const smooth = (u) => { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); };

const phase = (t, t0, d) => clamp((t - t0) / d, 0, 1);
const easeInOut = (u) => { u = clamp(u, 0, 1); return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };

const TAU = Math.PI * 2, DEG = Math.PI / 180;
const fract = (x) => x - Math.floor(x);

function cv(w, h, fast) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  if (fast) c.getContext('2d', { willReadFrequently: true });
  return c;
}

/* Smooth deterministic variation in t: a small sine stack per key. */
const WANDER = new Map();
function wander(key, t, hz = 0.3, n = 3) {
  let h = WANDER.get(key);
  if (!h) {
    const r = rngFor('w:' + key); h = [];
    for (let i = 0; i < n; i++) h.push([hz * (1 + i * 0.77 + r() * 0.3), r() * TAU, 1 / (1 + i)]);
    WANDER.set(key, h);

  let s = 0, norm = 0;
  for (const [f, p, a] of h) { s += Math.sin(TAU * f * t + p) * a; norm += a; }
  return s / norm;

/* ── colour: plate coverages ───────────────────────────────────────────────── */
// A colour is {y,p,o,b,g,i} in 0..1 (missing = 0).
const C = (y = 0, p = 0, o = 0, b = 0, g = 0, i = 0) => ({ y, p, o, b, g, i });
const cmix = (a, b, u) => C(lerp(a.y || 0, b.y || 0, u), lerp(a.p || 0, b.p || 0, u), lerp(a.o || 0, b.o || 0, u),
  lerp(a.b || 0, b.b || 0, u), lerp(a.g || 0, b.g || 0, u), lerp(a.i || 0, b.i || 0, u));
const cscale = (a, k) => C((a.y || 0) * k, (a.p || 0) * k, (a.o || 0) * k, (a.b || 0) * k, (a.g || 0) * k, (a.i || 0) * k);
// overprint: add ink toward full coverage on each plate
const cover = (a, b) => C(1 - (1 - (a.y || 0)) * (1 - (b.y || 0)), 1 - (1 - (a.p || 0)) * (1 - (b.p || 0)), 1 - (1 - (a.o || 0)) * (1 - (b.o || 0)),
  1 - (1 - (a.b || 0)) * (1 - (b.b || 0)), 1 - (1 - (a.g || 0)) * (1 - (b.g || 0)), 1 - (1 - (a.i || 0)) * (1 - (b.i || 0)));
const c255 = (v) => clamp(Math.round(v * 255), 0, 255);
const rgbA = (c, a = 1) => `rgba(${c255(c.y || 0)},${c255(c.p || 0)},${c255(c.o || 0)},${a})`;
const rgbB = (c, a = 1) => `rgba(${c255(c.b || 0)},${c255(c.g || 0)},${c255(c.i || 0)},${a})`;
const PAPERC = C();

/* ── painter: one drawing call lands on both packed canvases ────────────────
   A Pen wraps a pair of contexts (A, B). `style` is a colour, or a gradient
   spec {lin:[x0,y0,x1,y1] | rad:[x0,y0,r0,x1,y1,r1], stops:[[t, colour, a?]]}. */
function makeStyle(g, which, st) {
  if (st.lin || st.rad) {
    const gr = st.lin ? g.createLinearGradient(...st.lin) : g.createRadialGradient(...st.rad);
    for (const [u, c, a] of st.stops) gr.addColorStop(clamp(u, 0, 1), which ? rgbB(c, a ?? 1) : rgbA(c, a ?? 1));
    return gr;
  }

}
class Pen {
  constructor(a, b) { this.g = [a, b]; }
  get A() { return this.g[0]; }
  each(fn) { fn(this.g[0], 0); fn(this.g[1], 1); }
  save() { this.each(g => g.save()); }
  restore() { this.each(g => g.restore()); }
  setTransform(a, b, c, d, e, f) { this.each(g => g.setTransform(a, b, c, d, e, f)); }
  transform(a, b, c, d, e, f) { this.each(g => g.transform(a, b, c, d, e, f)); }
  translate(x, y) { this.each(g => g.translate(x, y)); }
  scale(x, y) { this.each(g => g.scale(x, y)); }
  rotate(r) { this.each(g => g.rotate(r)); }
  clip(path, rule) { this.each(g => g.clip(path, rule || 'nonzero')); }
  clear() { this.each(g => { g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, g.canvas.width, g.canvas.height); g.restore(); }); }
  /* op: 'put' (own the value), 'add' (overprint), 'lift' (remove fraction), 'mix' (put at alpha) */
  fill(path, st, op = 'put', alpha = 1, rule) {
    this.each((g, w) => {
      g.globalAlpha = alpha;
      if (op === 'add') { g.globalCompositeOperation = 'screen'; g.fillStyle = makeStyle(g, w, st); }
      else if (op === 'lift') { g.globalCompositeOperation = 'multiply'; g.fillStyle = makeStyle(g, w, liftStyle(st)); }
      else { g.globalCompositeOperation = 'source-over'; g.fillStyle = makeStyle(g, w, st); }
      g.fill(path, rule || 'nonzero');
      g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
    });
  }
  stroke(path, st, width, op = 'put', alpha = 1) {
    this.each((g, w) => {
      g.globalAlpha = alpha; g.lineWidth = width; g.lineCap = 'round'; g.lineJoin = 'round';
      g.globalCompositeOperation = op === 'add' ? 'screen' : op === 'lift' ? 'multiply' : 'source-over';
      g.strokeStyle = makeStyle(g, w, op === 'lift' ? liftStyle(st) : st);
      g.stroke(path);
      g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
    });
  }
  rect(x, y, w, h, st, op, alpha) { const p = new Path2D(); p.rect(x, y, w, h); this.fill(p, st, op, alpha); }
  image(pair, ...args) { this.g[0].drawImage(pair[0], ...args); this.g[1].drawImage(pair[1], ...args); }
  set alpha(a) { this.each(g => { g.globalAlpha = a; }); }
  set filter(f) { this.each(g => { g.filter = f; }); }
  set op(o) { this.each(g => { g.globalCompositeOperation = o; }); }
}
// 'lift' removes a fraction of ink: multiply by (1 - c)
function liftStyle(st) {
  const inv = (c) => C(1 - (c.y || 0), 1 - (c.p || 0), 1 - (c.o || 0), 1 - (c.b || 0), 1 - (c.g || 0), 1 - (c.i || 0));
  if (st.lin || st.rad) return Object.assign({}, st, { stops: st.stops.map(([u, c, a]) => [u, inv(c), a]) });

}
function penPair(w, h, fast = false) {
  const a = cv(w, h), b = cv(w, h);
  const o = fast ? { willReadFrequently: true } : undefined;
  return { pen: new Pen(a.getContext('2d', o), b.getContext('2d', o)), canv: [a, b] };
}

/* ── shape builders (craft kit, simplified) ─────────────────────────────────── */
function poly(pts, closed = true) {
  // closed shapes are wound one way so unions of subpaths never cancel into holes
  if (closed && pts.length > 2) {
    let A = 0;
    for (let i = 0, n = pts.length; i < n; i++) { const q = pts[i], r = pts[(i + 1) % n]; A += q[0] * r[1] - r[0] * q[1]; }
    if (A < 0) pts = pts.slice().reverse();
  }
  const p = new Path2D();
  pts.forEach(([x, y], i) => i ? p.lineTo(x, y) : p.moveTo(x, y));
  if (closed) p.closePath();

}
// Catmull-Rom through points as a dense polyline
function curve(pts, closed = false, per = 8) {
  const out = [], n = pts.length;
  const get = (i) => closed ? pts[(i + n) % n] : pts[clamp(i, 0, n - 1)];
  const segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const p0 = get(i - 1), p1 = get(i), p2 = get(i + 1), p3 = get(i + 2);
    for (let k = 0; k < per; k++) {
      const t = k / per, t2 = t * t, t3 = t2 * t;
      out.push([
        0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
        0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3),

}
// hand-cut contour: displace a closed polyline along normals by smoothed noise
function cut(pts, rng, amp = 1.2) {
  const n = pts.length, d = new Float32Array(n);
  for (let i = 0; i < n; i++) d[i] = (rng() * 2 - 1) * amp;
  for (let pass = 0; pass < 2; pass++) for (let i = 0; i < n; i++) d[i] = (d[(i - 1 + n) % n] + d[i] * 2 + d[(i + 1) % n]) / 4;
  return pts.map(([x, y], i) => {
    const a = pts[(i - 1 + n) % n], b = pts[(i + 1) % n];
    let nx = b[1] - a[1], ny = a[0] - b[0];

}
// variable-width ribbon along a polyline
function nib(pts, wfn) {
  const L = [], R = [], n = pts.length;
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1];
    const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
    const w = wfn(n > 1 ? i / (n - 1) : 0) / 2;
    L.push([pts[i][0] - ty * w, pts[i][1] + tx * w]);

function ellipsePath(x, y, rx, ry, rot = 0) { const p = new Path2D(); p.ellipse(x, y, Math.max(0.01, rx), Math.max(0.01, ry), rot, 0, TAU); return p; }

/* ── halftone screens ───────────────────────────────────────────────────────── */
function buildScreen(name, pitch = PITCH) {
  const { a, b } = SCREEN[name];
  const n = a * a + b * b;
  const S = Math.max(2, Math.round(pitch * Math.sqrt(n)));
  const P = S / Math.sqrt(n), u = P / Math.sqrt(n);
  const v1 = [u * a, u * b], v2 = [-u * b, u * a];
  const pts = [];
  for (let m = -n; m <= n; m++) for (let k = -n; k <= n; k++) {
    const x = m * v1[0] + k * v2[0], y = m * v1[1] + k * v2[1];
    const wx = ((x % S) + S) % S, wy = ((y % S) + S) % S;
    if (!pts.some(q => Math.abs(q[0] - wx) < 0.01 && Math.abs(q[1] - wy) < 0.01)) pts.push([wx, wy]);
  }
  const wrapped = [];
  for (const [x, y] of pts) for (const dx of [-S, 0, S]) for (const dy of [-S, 0, S]) wrapped.push([x + dx + 0.5, y + dy + 0.5]);
  const th = new Float32Array(S * S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    let d2 = Infinity;
    for (const [px, py] of wrapped) { const dx = x + 0.5 - px, dy = y + 0.5 - py, q = dx * dx + dy * dy; if (q < d2) d2 = q; }

/* Threshold per pixel (0..255): screen + mottling + jitter, starvation = 255. */
function buildThr(name, pitch = PITCH) {
  const sc = buildScreen(name, pitch), S = sc.S, t = new Uint8Array(W * H), r = rngFor('thr:' + name + pitch);
  const R = 24, R2 = R + 2, nz = new Float32Array(R2 * R2);
  for (let i = 0; i < nz.length; i++) nz[i] = r() * 2 - 1;
  for (let y = 0; y < H; y++) {
    const fy = y / W * R, iy = fy | 0, vy = fy - iy, row = (y % S) * S;
    for (let x = 0; x < W; x++) {
      const fx = x / W * R, ix = fx | 0, vx = fx - ix, k = iy * R2 + ix;
      const m = (nz[k] * (1 - vx) + nz[k + 1] * vx) * (1 - vy) + (nz[k + R2] * (1 - vx) + nz[k + R2 + 1] * vx) * vy;
      t[y * W + x] = clamp(Math.round(sc.th[row + x % S] * 234 + 9 + m * 8 + (r() - 0.5) * 16), 3, 250);

  for (let i = 0; i < flecks; i++) {
    const cx = r() * W, cy = r() * H, rad = 0.5 + r() * r() * 2.4, rr = rad * rad;
    for (let y = Math.max(0, Math.floor(cy - rad)); y <= Math.min(H - 1, Math.ceil(cy + rad)); y++)

/* ── paper ─────────────────────────────────────────────────────────────────── */
function bakePaper() {
  const c = cv(W, H), x = c.getContext('2d');
  x.fillStyle = PAPER; x.fillRect(0, 0, W, H);
  const r = rngFor('paper');
  for (const [res, maxA] of [[32, 0.10], [80, 0.07], [180, 0.05]]) {
    const rh = Math.round(res * H / W);
    const n = cv(res, rh), nx = n.getContext('2d'), img = nx.createImageData(res, rh);
    for (let i = 0; i < res * rh; i++) {
      img.data[i * 4] = 0xB4; img.data[i * 4 + 1] = 0xA6; img.data[i * 4 + 2] = 0x8C;
      img.data[i * 4 + 3] = Math.pow(r(), 1.8) * 255 * maxA;

    nx.putImageData(img, 0, 0);

    x.drawImage(n, 0, 0, W, H);

    const px = r() * W, py = r() * H, len = 5 + r() * 22, ang = r() * Math.PI;
    x.globalAlpha = 0.008 + r() * 0.016; x.lineWidth = 0.5 + r() * 0.7;
    x.beginPath(); x.moveTo(px, py);
    x.quadraticCurveTo(px + Math.cos(ang) * len * 0.5 + (r() - 0.5) * 5, py + Math.sin(ang) * len * 0.5 + (r() - 0.5) * 5,

    x.stroke();

  for (let i = 0; i < 4000; i++) {
    x.globalAlpha = 0.012 + r() * 0.03;
    x.fillStyle = r() < 0.55 ? '#7d7362' : '#ffffff';

/* ── the frame: packed plate canvases and the compositor ────────────────────── */
const FRAME = penPair(PW, PH, true);
const pen = FRAME.pen, FA = pen.g[0], FB = pen.g[1];

let FACC = null, THR = null, THRF = null, PAPERPX = null, OUTIMG = null, FAC = null;
/* Fine detail (faces, hands) is printed on a half-pitch screen, as a printer

const FINE = cv(PW, PH, true).getContext('2d', { willReadFrequently: true });

function fineClear() { FINE.setTransform(1, 0, 0, 1, 0, 0); FINE.clearRect(0, 0, PW, PH); }

  // with a ~1 px soft edge so dots are anti-aliased rather than stair-stepped.
  FAC = PLATES.map(n => {
    const ink = [1, 3, 5].map(i => parseInt(INK[n].substr(i, 2), 16) / 255);
    const f = [new Uint16Array(512), new Uint16Array(512), new Uint16Array(512)];
    for (let d = -255; d <= 256; d++) {
      const amt = clamp(d / 22 + 0.5, 0, 1);
      for (let ch = 0; ch < 3; ch++) f[ch][d + 255] = Math.round(256 * (1 - amt * (1 - ink[ch])));
    }
    return f;
  });

function compose(outCtx) {
  const a = FA.getImageData(0, 0, PW, PH).data, b = FB.getImageData(0, 0, PW, PH).data;
  const o = OUTIMG.data, pp = PAPERPX;
  // pixel (x,y) of the print samples plate coverage at (x+PAD-dx, y+PAD-dy)
  const off = PLATES.map(n => ((PAD - REG[n][1]) * PW + (PAD - REG[n][0])) * 4);
  const o0 = off[0], o1 = off[1] + 1, o2 = off[2] + 2, o3 = off[3], o4 = off[4] + 1, o5 = off[5] + 2;
  const fm = FINE.getImageData(0, 0, PW, PH).data;
  const [c0, c1, c2, c3, c4, c5] = THR, [e0, e1, e2, e3, e4, e5] = THRF;
  const [f0, f1, f2, f3, f4, f5] = FAC;
  const r0 = f0[0], g0 = f0[1], b0 = f0[2], r1 = f1[0], g1 = f1[1], b1 = f1[2], r2 = f2[0], g2 = f2[1], b2 = f2[2];
  const r3 = f3[0], g3 = f3[1], b3 = f3[2], r4 = f4[0], g4 = f4[1], b4 = f4[2], r5 = f5[0], g5 = f5[1], b5 = f5[2];
  for (let y = 0; y < H; y++) {

/* ── camera ──────────────────────────────────────────────────────────────────
   World metres: X right, Y up, Z away from the lens (positive depth forward).

/* ════ figures.js ════ */
/* ── figures: rig and gait ────────────────────────────────────────────────────
   Two walkers built as 3D skeletons and drawn as projected silhouettes.

   Gait is planned from footsteps, not from a looping cycle: each foot is
   planted on the ground at a footprint and cannot slide while it bears
   weight; the swing foot travels between footprints with heel-strike and
   toe-off roll. Legs are two-bone IK from hip to ankle. The pelvis travels
   a monotone curve through the mid-stance points, and its height is the most
   the stance legs can reach (the compass-gait bob), smoothed. Arms are
   damped pendulums driven by the opposite leg and by the body's acceleration,

/* ── vector math ──────────────────────────────────────────────────────────── */

    const rot = (px) => {            // local (x, y) of ankle relative to the pivot, rotated
      const ax = -px, ay = G.ah;       // ankle relative to pivot on the ground
      const c = Math.cos(pitch), s = Math.sin(pitch);
      return [px + ax * c - ay * s * 1 + 0 * s, ax * s + ay * c];
    };
    let ax, ay;
    if (pivot === 'heel') { const r = rot(G.heel); ax = r[0]; ay = r[1]; }
    else if (pivot === 'ball') {
      // rotate about the ball: rear foot lifts, pitch negative
      const c = Math.cos(pitch), s = Math.sin(pitch), rx = -G.ball, ry = G.ah;
      ax = G.ball + rx * c - ry * s; ay = rx * s + ry * c;
    } else { ax = 0; ay = G.ah; }
    const ankle = [base[0] + fr.f[0] * ax, ay, base[2] + fr.f[2] * ax];
    return { ankle, yaw: f.yaw, pitch, toeBend: pivot === 'ball' ? -pitch : 0, planted: true };
  };
  // which footprint governs this foot at time t
  const feet = w.feet;
  let cur = null;
  for (const f of feet) if (f.side === foot && f.t <= t) cur = f;
  if (!cur) { // before the first strike of this foot: treat as the first
    cur = feet.find(f => f.side === foot);
    return planted(cur, cur.t);
  }
  if (t <= cur.lift || !cur.next) return planted(cur, t);

  const nx = cur.next, t0 = cur.lift, t1 = nx.t;
  const u = clamp((t - t0) / (t1 - t0), 0, 1);

/* ── precompute tracks ──────────────────────────────────────────────────── */
function prepareWalker(w) {
  planWalker(w);
  const D = w.dims, legL = D.thigh + D.shin;
  const T0 = 1.0, T1 = DUR + 0.2, RATE = 240;
  // pelvis height: highest the stance legs allow
  const hipLocal = (t) => {
    const d = w.Dof(t), pp = w.path(d), fr = frameH(pp.h), lat = w.latOf(t);
    return { pp, fr, lat, d };
  };
  const raw = track(T0, T1, RATE, (t) => {
    const { pp, fr, lat } = hipLocal(t);
    let y = D.hipH - 0.004;
    for (const side of [-1, 1]) {
      const fs = footState(w, side, t);
      // weight-bearing if planted or about to be (near strike)
      if (!fs.planted) continue;
      const hip = [pp.x + fr.r[0] * (lat + side * D.hipHalf), 0, pp.z + fr.r[2] * (lat + side * D.hipHalf)];
      const dx = hip[0] - fs.ankle[0], dz = hip[2] - fs.ankle[2];
      const h2 = dx * dx + dz * dz, reach = legL * 0.992;
      if (h2 < reach * reach) y = Math.min(y, fs.ankle[1] + Math.sqrt(reach * reach - h2));
    }
    return y;
  });
  const sm = gaussTrack(raw, 0.028);
  let over = 0;
  for (let i = 0; i < sm.length; i++) over = Math.max(over, sm[i] - raw.v[i]);
  for (let i = 0; i < sm.length; i++) sm[i] -= over * 0.85;
  raw.v.set(sm);
  w.pelvisY = raw;
  // pelvis velocity/acceleration along the path (for lean, arm and cloth dynamics)
  w.speed = track(T0, T1, RATE, (t) => (w.Dof(t + 0.004) - w.Dof(t - 0.004)) / 0.008);
  const acc = track(T0, T1, RATE, (t) => (w.speed(t + 0.01) - w.speed(t - 0.01)) / 0.02);
  // arm pendulums: target from the opposite foot's forward offset
  const fwdOff = (side, t) => {
    const { pp, fr } = hipLocal(t), fs = footState(w, side, t);
    return (fs.ankle[0] - pp.x) * fr.f[0] + (fs.ankle[2] - pp.z) * fr.f[2];
  };
  for (const side of [-1, 1]) {
    const om = TAU * 1.05, zeta = 0.42, dt = 1 / RATE;
    const n = Math.ceil((T1 - T0) * RATE) + 1, th = new Float64Array(n);
    let a = 0, v = 0;
    // run in from the steady state so the swing is established when it starts
    for (let pass = 0; pass < 2; pass++) {
      for (let i = 0; i < n; i++) {
        const t = T0 + i * dt;
        const target = w.armAmp * clamp(fwdOff(-side, t) / (w.steady.len * 0.62), -1.3, 1.3) * clamp(w.speed(t) / 1.0, 0, 1.1);
        const acc2 = om * om * (target - a) - 2 * zeta * om * v - 1.6 * acc(t);
        v += acc2 * dt; a += v * dt;
        if (pass === 1) th[i] = a;
        if (pass === 0 && i > RATE * 1.5) break;
      }
    }
    const tr = (t) => { const x = clamp((t - T0) * RATE, 0, n - 1), i = Math.min(n - 2, x | 0), u = x - i; return th[i] * (1 - u) + th[i + 1] * u; };
    w['arm' + side] = tr;
  }
  // cloth / hair follow-through: a damped spring driven by forward acceleration
  {
    const om = TAU * 1.5, zeta = 0.3, dt = 1 / RATE;
    const n = Math.ceil((T1 - T0) * RATE) + 1, s = new Float64Array(n);
    let x = 0, v = 0;
    for (let i = 0; i < n; i++) {
      const t = T0 + i * dt;
      const f = -acc(t) * 0.05 + (w.speed(t) * -0.035);
      v += (om * om * (f - x) - 2 * zeta * om * v) * dt; x += v * dt; s[i] = x;
    }
    w.lag = (t) => { const xx = clamp((t - T0) * RATE, 0, n - 1), i = Math.min(n - 2, xx | 0), u = xx - i; return s[i] * (1 - u) + s[i + 1] * u; };
  }
  return w;
}

/* ── pose ──────────────────────────────────────────────────────────────────
   Returns world-space joints and frames for time t.                        */
function pose(w, t, other) {
  const D = w.dims;
  const d = w.Dof(t), pp = w.path(d), baseFr = frameH(pp.h);
  const sp = w.speed(t), stand = smooth((t - w.tClose - 0.1) / 0.8);
  const lat = w.latOf(t) + stand * 0.012 * Math.sin(0.9 + 0.45 * (t - w.tClose)) * w.side;
  const py = w.pelvisY(t);
  // feet
  const fl = footState(w, -1, t), fr_ = footState(w, 1, t);
  const fwdOf = (fs) => (fs.ankle[0] - pp.x) * baseFr.f[0] + (fs.ankle[2] - pp.z) * baseFr.f[2];
  const diff = (fwdOf(fr_) - fwdOf(fl)) / Math.max(0.2, w.steady.len);   // right foot ahead → +
  // pelvis: yaw toward the forward leg, drop on the swing side, a slight forward tilt with speed
  const pYaw = -diff * 5.5 * DEG;
  const stanceSide = fl.planted && !fr_.planted ? -1 : fr_.planted && !fl.planted ? 1 : 0;
  const pRoll = -stanceSide * 3.2 * DEG * clamp(sp, 0, 1);
  let pelFr = frameH(pp.h + pYaw);
  pelFr = frameRot(pelFr, 'f', pRoll);
  const pel = [pp.x + baseFr.r[0] * lat, py, pp.z + baseFr.r[2] * lat];
  const hipL = L2W(pelFr, pel, 0, -0.02, -D.hipHalf), hipR = L2W(pelFr, pel, 0, -0.02, D.hipHalf);
  // knees point forward and a little out
  const legPole = (side) => vnorm(vadd(vmul(baseFr.f, 1), vmul(baseFr.r, side * 0.12)));
  const legL = ik2(hipL, fl.ankle, D.thigh, D.shin, legPole(-1));
  const legR = ik2(hipR, fr_.ankle, D.thigh, D.shin, legPole(1));
  // spine: lean with speed, counter-rotate the chest
  const lean = (2.5 + 2.5 * clamp(sp, 0, 1.2)) * DEG + w.lag(t) * 0.6;
  const breath = Math.sin(TAU * 0.27 * t + (w.side > 0 ? 1.7 : 0.2)) * stand;
  let chestFr = frameH(pp.h - pYaw * 0.9);
  chestFr = frameRot(chestFr, 'r', -lean);
  chestFr = frameRot(chestFr, 'f', -pRoll * 0.5);
  const waist = L2W(frameRot(frameH(pp.h), 'r', -lean * 0.5), pel, 0.0, D.waistH - D.hipH, 0);
  const chest = L2W(chestFr, pel, 0.012, D.chestH - D.hipH, 0);
  const neck = L2W(chestFr, pel, -0.01, D.neckH - D.hipH + breath * 0.002, 0);
  const shL = L2W(chestFr, pel, -0.005, D.shoulderH - D.hipH + breath * 0.003, -D.shoulderHalf);
  const shR = L2W(chestFr, pel, -0.005, D.shoulderH - D.hipH + breath * 0.003, D.shoulderHalf);
  // head: stabilised, looks along the path, then at the other walker
  const headC0 = L2W(chestFr, pel, 0.03, D.chinH - D.hipH + 0.105 * D.headScale / 0.915, 0);
  let lookYaw = pp.h, lookPitch = -7 * DEG;
  if (other) {
    const op = other.path(other.Dof(t)), oh = [op.x, 1.57, op.z];
    const dv = vsub(oh, headC0);
    const toYaw = Math.atan2(dv[2], dv[0]), toPitch = Math.atan2(dv[1], Math.hypot(dv[0], dv[2]));
    const k = smoother((t - w.notice) / 0.55);
    lookYaw = angLerp(pp.h, toYaw, k);
    lookPitch = lerp(-7 * DEG, toPitch, k);
  }
  // the head turns at most 60° from the chest; the rest is carried by the eyes
  let hy = Math.atan2(Math.sin(lookYaw - pp.h), Math.cos(lookYaw - pp.h));
  hy = clamp(hy, -60 * DEG, 60 * DEG);
  const headYaw = pp.h + hy * 0.85;
  const nod = -0.012 * Math.sin(TAU * (t - w.tClose) * 0.5) * 0;
  const tilt = (stand * (w.side < 0 ? 4 : -2.5) * DEG) + wander(w.side + 'tilt', t, 0.15) * 1.2 * DEG;
  let headFr = frameH(headYaw);
  headFr = frameRot(headFr, 'r', lookPitch * 0.8 + nod);
  headFr = frameRot(headFr, 'f', tilt);
  const headC = L2W(chestFr, pel, 0.025, D.chinH - D.hipH + 0.108 * D.headScale / 0.915, 0);
  // arms
  const arms = {};
  for (const side of [-1, 1]) {
    const sh = side < 0 ? shL : shR;
    const th = w['arm' + side](t);
    const ua = D.upperArm, fa = D.forearm;
    // swing plane: forward-down, abducted a little
    let dir = vmul(chestFr.u, -1);
    dir = vrot(dir, chestFr.r, th);                  // positive th swings forward
    dir = vrot(dir, chestFr.f, -side * w.armAbd);    // away from the body
    const elbow = vmad(sh, dir, ua);
    const flex = w.elbowBase + Math.max(0, th) * (w.elbowSwing / w.armAmp);
    const fdir = vrot(dir, chestFr.r, flex);
    const wristFK = vmad(elbow, fdir, fa);
    let wrist = wristFK, pole = vadd(vmul(chestFr.f, -1), vmul(chestFr.r, side * 0.5));
    // final pose blend
    const pb = w.poseArms ? w.poseArms(side, t, { pel, chestFr, baseFr: frameH(w.path(w.L).h), sh }) : null;
    if (pb) { wrist = vlerp(wristFK, pb.wrist, pb.k); pole = vnorm(vlerp(pole, pb.pole, pb.k)); }
    const handIn = pb && pb.hand === 'pocket' ? smooth((pb.k - 0.75) / 0.25) : 0;
    const sol = ik2(sh, wrist, ua, fa, pole);
    const handDir = vnorm(vsub(sol.end, sol.mid));
    arms[side] = { sh, elbow: sol.mid, wrist: sol.end, handDir, hand: vmad(sol.end, handDir, 0.075), handIn };
  }
  return {
    t, pp, baseFr, pel, pelFr, chestFr, headFr, headC, waist, chest, neck, shL, shR, hipL, hipR,
    kneeL: legL.mid, kneeR: legR.mid, ankL: legL.end, ankR: legR.end, footL: fl, footR: fr_,
    arms, stand, breath, lookYaw, lookPitch, sp,
  };
}

/* ── figures: drawing ────────────────────────────────────────────────────────
   Parts are built from projected 3D points into screen-space silhouettes
   (convex hulls of projected rings and circles), painted far to near. The
   sun sits behind the pair on the seam, so every surface the lens sees is in
   skylight; the sun only rims the edges that face it. Rim light is the part
   of a silhouette left uncovered when the shadow fill is shifted away from
   the sun: a crescent on the lit edge, as a printer would cut it.          */

const SUN = { x: CX, y: CY - 30, elev: 1.6 * DEG };

function hull(pts) {
  const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  if (p.length < 3) return p;
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const q of p) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
  for (let i = p.length - 1; i >= 0; i--) { const q = p[i]; while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); }
  up.pop(); lo.pop();
  return lo.concat(up);
}
const P2 = (p) => { const s = proj(p[0], p[1], p[2]); return [s[0], s[1], F / s[2]]; };
function circlePts(c, r, n = 14) { const o = []; for (let i = 0; i < n; i++) { const a = i / n * TAU; o.push([c[0] + Math.cos(a) * r, c[1] + Math.sin(a) * r]); } return o; }
// screen-space capsule through world joints with world radii
function capsulePts(pts3, radii, n = 12) {
  const o = [];
  pts3.forEach((p, i) => { const s = P2(p); o.push(...circlePts(s, radii[i] * s[2], n)); });
  return o;
}
function capsule(pts3, radii) { return poly(hull(capsulePts(pts3, radii))); }
// ring of an ellipse in a frame: centre, frame, half-depth (f), half-width (r)
function ringPts(o, fr, df, wr, n = 20, a0 = 0) {
  const out = [];
  for (let i = 0; i < n; i++) { const a = a0 + i / n * TAU; out.push(L2W(fr, o, Math.cos(a) * df, 0, Math.sin(a) * wr)); }
  return out;
}
function ellipsoidPts(c, fr, ra, rb, rc, n = 10) {
  const o = [];
  for (let i = 1; i < n; i++) {
    const th = i / n * Math.PI, y = Math.cos(th), rr = Math.sin(th);
    for (let j = 0; j < n * 2; j++) { const ph = j / (n * 2) * TAU; o.push(L2W(fr, c, Math.cos(ph) * rr * ra, y * rb, Math.sin(ph) * rr * rc)); }
  }
  o.push(L2W(fr, c, 0, rb, 0), L2W(fr, c, 0, -rb, 0));
  return o;
}

/* Parts are filled flat in their skylit tone and their outlines collected;

   edge inside the silhouette is shadowed by the body behind it.          */
let SIL = null;
function litFill(path, shade, lit, cx, cy, rimPx, extra) {
  pen.fill(path, shade);
  if (SIL) SIL.addPath(path);
  if (extra) { pen.save(); pen.clip(path); extra(); pen.restore(); }
}
const RIMM = cv(PW, PH).getContext('2d'), RIMC = cv(PW, PH).getContext('2d');
function rimPass(sil, cx, cy, rimPx, strength = 1, lift = C(0.3, 0.45, 0.35, 0.62, 0.62, 0.62), add = C(0.34, 0.03, 0.2)) {
  let dx = SUN.x - cx, dy = SUN.y - cy; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
  // crescent mask: the silhouette minus itself shifted away from the sun
  const m = RIMM;
  m.setTransform(1, 0, 0, 1, 0, 0); m.globalCompositeOperation = 'source-over'; m.globalAlpha = 1;
  m.clearRect(0, 0, PW, PH);
  m.setTransform(1, 0, 0, 1, PAD, PAD); m.fillStyle = '#fff'; m.fill(sil);
  m.globalCompositeOperation = 'destination-out';
  m.setTransform(1, 0, 0, 1, PAD - dx * rimPx, PAD - dy * rimPx * 0.7); m.fill(sil);
  m.globalCompositeOperation = 'source-over';
  const c = RIMC;
  const layer = (col, which) => {
    c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
    c.clearRect(0, 0, PW, PH); c.drawImage(m.canvas, 0, 0);
    c.globalCompositeOperation = 'source-in'; c.fillStyle = which ? rgbB(col) : rgbA(col); c.fillRect(0, 0, PW, PH);
    c.globalCompositeOperation = 'source-over';
  };
  const inv = C(1 - lift.y * strength, 1 - lift.p * strength, 1 - lift.o * strength, 1 - lift.b * strength, 1 - lift.g * strength, 1 - lift.i * strength);
  pen.g.forEach((g, which) => {
    g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
    layer(inv, which); g.globalCompositeOperation = 'multiply'; g.drawImage(c.canvas, 0, 0);
    layer(cscale(add, strength), which); g.globalCompositeOperation = 'screen'; g.drawImage(c.canvas, 0, 0);
    g.restore();

}
// linear coverage ramp across a part (darker toward `toward`), clipped to the part

  pen.save(); pen.clip(path);
  pen.fill(path, { lin: [x0, y0, x1, y1], stops: [[0, col, a0], [1, col, a1]] }, 'add');
  pen.restore();
}

  const neckTop = H(-0.012, -0.075, 0), neckBase = ps.neck;

  const neck = capsule([neckBase, neckTop], [neckR, neckR * 0.93]);
  litFill(neck, cover(lk.skin, C(0, 0.07, 0.1, 0.03, 0, 0.07)), lk.skinLit, hc[0], hc[1], rim);
  // back hair mass (behind neck and head)
  if (isH) {
    const lag = w.lag(ps.t) * 0.8, pts = [];
    for (let i = 0; i <= 8; i++) {
      const u = i / 8, b = lerp(0.0, -0.18, u);
      const half = lerp(0.092, 0.078, u * u), back = lerp(-0.07, -0.058, u);
      for (const k of [-1, -0.6, 0, 0.6, 1]) {
        const cc = k * half;
        pts.push(H(back + (1 - Math.abs(k)) * -0.025 + u * u * lag * 1.2 + Math.abs(k) * lerp(0.05, 0.0, u), b - (1 - Math.abs(k)) * 0.012 * u, cc));
      }
    }
    const back = hull3(pts.concat(ellipsoidPts(H(-0.015, 0.03, 0), M.fr, 0.104 * M.s, 0.111 * M.s, 0.087 * M.s, 8)));
    litFill(back, lk.hair, lk.hairLit, hc[0], hc[1], rim * 1.3);
  }
  // skull, then the hair cap over it, then the face in front of the hairline
  const skull = ellipsoidPts(H(-0.012, 0.028, 0), M.fr, 0.097 * M.s, 0.104 * M.s, 0.077 * M.s, 10);
  const jaw = ellipsoidPts(H(0.026, -0.047, 0), M.fr, 0.068 * M.s, 0.068 * M.s, (isH ? 0.058 : 0.064) * M.s, 9);
  const headHull = hull3(skull.concat(jaw));
  const prof = PROFILE[id].map(([a, b]) => H(a, b, 0));
  const fan = poly([P2(H(0.0, -0.02, 0))].concat(prof.map(P2)).concat([P2(H(-0.02, -0.09, 0))]));
  litFill(headHull, lk.skin, lk.skinLit, hc[0], hc[1], rim);
  // hairline in head units: hair where a < lim(b) (forehead, temples, behind the ear)
  const hairLim = (b, cc) => {
    let lim;
    if (isH) lim = b > 0.05 ? 0.062 : b > -0.01 ? lerp(0.006, 0.062, (b + 0.01) / 0.06) : -0.028;
    else lim = b > 0.056 ? 0.07 : b > 0.004 ? lerp(0.02, 0.07, (b - 0.004) / 0.052) : b > -0.035 ? 0.006 : -0.05;
    return lim - Math.abs(cc) * 0.1;
  };
  const local = (p) => { const q = vsub(p, M.c); return [vdot(q, M.fr.f) / M.s, vdot(q, M.fr.u) / M.s, vdot(q, M.fr.r) / M.s]; };
  const cap = ellipsoidPts(H(isH ? -0.014 : -0.01, isH ? 0.032 : 0.04, isH ? 0 : -0.004), M.fr, (isH ? 0.105 : 0.1) * M.s, (isH ? 0.112 : 0.106) * M.s, (isH ? 0.087 : 0.081) * M.s, 11);
  const capPts = [];
  for (const p of cap) { const [a, b, cc] = local(p); if (a < hairLim(b, cc) + 0.012) capPts.push(p); }
  if (isH) {
    const lag = w.lag(ps.t) * 0.8;
    for (let i = 0; i <= 6; i++) { const u = i / 6; capPts.push(H(lerp(-0.028, -0.05, u) + u * u * lag, lerp(0.0, -0.18, u), near * lerp(0.091, 0.08, u * u))); }
  } else {
    capPts.push(H(0.07, 0.112, 0.02), H(0.086, 0.088, 0.035), H(0.084, 0.084, -0.01), H(0.05, 0.128, 0.0), H(0.0, 0.14, -0.02));
  }
  const hairCap = hull3(capPts);
  litFill(hairCap, lk.hair, lk.hairLit, hc[0], hc[1], rim * 1.4);
  {
    pen.save(); pen.clip(hairCap);
    const rs = rngFor(id + 'strands');
    for (let i = 0; i < 6; i++) {
      const c0 = (rs() - 0.5) * 0.1, a0 = 0.04 - rs() * 0.1;
      const line = [H(a0 + 0.02, 0.11, c0 * 0.5), H(a0 - 0.01, 0.06, c0 + 0.03 * near), H(a0 - 0.03, isH ? -0.08 : 0.0, c0 * 0.8 + 0.07 * near)].map(P2);
      pen.stroke(poly(curve(line.map(q => [q[0], q[1]]), false, 6), false), cover(lk.hair, C(0, 0.15, 0.1, 0.15, 0, 0.35)), Math.max(0.8, 0.0035 * S), 'put', 0.6);
    }
    pen.restore();
  }
  // the face: skin surface in front of the hairline, plus the midline profile
  const facePts = [];
  for (const p of skull.concat(jaw)) { const [a, b, cc] = local(p); if (a > hairLim(b, cc) + 0.004 && b < (isH ? 0.075 : 0.08)) facePts.push(p); }
  const face = new Path2D(); face.addPath(hull3(facePts.concat(prof))); face.addPath(fan);
  litFill(face, lk.skin, lk.skinLit, hc[0], hc[1], rim);
  // a cool turn toward the jaw and under the chin
  pen.save(); pen.clip(face);
  const jawBack = P2(H(-0.03, -0.07, 0)), brow = P2(H(0.06, 0.05, 0));
  pen.fill(face, { lin: [brow[0], brow[1], jawBack[0], jawBack[1]], stops: [[0, C(), 0], [0.55, C(), 0], [1, C(0, 0.06, 0.08, 0.05, 0, 0.05), 1]] }, 'add');
  const ck = P2(H(0.058, -0.035, 0.045 * near));
  pen.fill(ellipsePath(ck[0], ck[1], 0.026 * S * M.s, 0.018 * S * M.s), { rad: [ck[0], ck[1], 0, ck[0], ck[1], 0.026 * S * M.s], stops: [[0, lk.cheek, 1], [1, lk.cheek, 0]] }, 'add');
  pen.restore();
  // fringe and strands on top
  if (isH) {
    const fr0 = [H(0.052, 0.098, 0.0), H(0.08, 0.066, -0.01 * near), H(0.092, 0.042, 0.0), H(0.088, 0.03, 0.022 * near),
      H(0.074, 0.03, 0.045 * near), H(0.05, 0.05, 0.07 * near), H(0.02, 0.09, 0.05 * near)];
    const fringe = hull3(fr0);
    litFill(fringe, lk.hair, lk.hairLit, hc[0], hc[1], rim * 1.2);
  }
  // ear on the near side
  if (Math.abs(M.facing) < 0.93) {
    const ec = [-0.004, -0.012, 0.076 * near], ep = [];
    for (let i = 0; i < 14; i++) {
      const a = i / 14 * TAU;
      ep.push(P2(H(ec[0] + Math.cos(a) * 0.015 - 0.004 * Math.max(0, Math.sin(a)), ec[1] + Math.sin(a) * (a > Math.PI ? 0.026 : 0.03), ec[2] + 0.004 * near)));
    }
    const ear = poly(curve(ep.map(q => [q[0], q[1]]), true, 3));
    pen.fill(ear, lk.skin);
    pen.fill(ear, C(0, 0.18, 0.12, 0.05, 0, 0.12), 'add', 0.6);
    const e1 = P2(H(ec[0] + 0.002, ec[1] + 0.012, ec[2])), e2 = P2(H(ec[0] + 0.006, ec[1] - 0.012, ec[2]));
    pen.stroke(poly([[e1[0], e1[1]], [e2[0], e2[1]]], false), C(0.05, 0.3, 0.25, 0.1, 0, 0.3), Math.max(0.8, 0.004 * S));
  }
  // features on the near side of the face
  drawFace(w, ps, lk, id, M, S);
  const fineP = new Path2D(); fineP.addPath(face); fineP.addPath(hairCap); fineP.addPath(headHull); fineMark(fineP);
}

function drawFace(w, ps, lk, id, M, S) {
  const H = M.H, near = M.near, isH = id === 'hana';
  const t = ps.t;
  const px = (a, b, c) => { const q = P2(H(a, b, c)); return [q[0], q[1]]; };
  const lw = (k) => Math.max(1.2, k * S * M.s * 1.25);
  // brow
  const browC = isH ? lk.brow : lk.brow;
  pen.stroke(poly(curve([px(0.088, 0.017, 0.012 * near), px(0.084, 0.023, 0.03 * near), px(0.07, 0.024, 0.05 * near)], false, 5), false), browC, lw(isH ? 0.0062 : 0.0075));
  // eye: almond between inner and outer corners, set into the socket
  const blink = blinkAt(id, t);
  const ic = [0.08, 0.004, 0.018 * near], oc = [0.064, 0.006, 0.05 * near];
  const mid = (u, up) => [lerp(ic[0], oc[0], u) + 0.004 * Math.sin(Math.PI * u), lerp(ic[1], oc[1], u) + up * Math.sin(Math.PI * u), lerp(ic[2], oc[2], u)];
  const openUp = 0.0085 * (1 - blink), openDn = -0.0052 * (1 - blink);
  const upper = [], lower = [];
  for (let i = 0; i <= 6; i++) { const u = i / 6; upper.push(px(...mid(u, openUp))); lower.push(px(...mid(u, openDn))); }
  const eyeP = poly(upper.concat(lower.slice().reverse()));
  if (blink < 0.9) {
    pen.fill(eyeP, C(0.02, 0.03, 0.02, 0.05, 0, 0.06));        // white of the eye, a little shaded
    // iris: shifted toward where the eyes look
    const look = clamp(Math.atan2(Math.sin(ps.lookYaw - Math.atan2(M.fr.f[2], M.fr.f[0])), 1) * 0.5, -0.3, 0.3);
    const irisC = px(lerp(ic[0], oc[0], 0.28 - look * near * 0.3) + 0.004, ic[1] + 0.001, lerp(ic[2], oc[2], 0.28 - look * near * 0.3));
    const irR = Math.max(1.6, 0.0082 * S * M.s);
    pen.save(); pen.clip(eyeP);
    pen.fill(ellipsePath(irisC[0], irisC[1], irR * 0.75, irR), lk.iris);
    pen.fill(ellipsePath(irisC[0], irisC[1], irR * 0.35, irR * 0.45), C(0.1, 0.3, 0.3, 0.4, 0, 1.0));
    pen.restore();
  }
  // upper lid and lash line
  pen.stroke(poly(upper, false), isH ? C(0.1, 0.6, 0.5, 0.4, 0, 1) : C(0.2, 0.5, 0.6, 0.3, 0, 1), lw(isH ? 0.0062 : 0.0052));
  // nostril
  const n0 = px(0.093, -0.046, 0.011 * near);
  pen.fill(ellipsePath(n0[0], n0[1], lw(0.0042), lw(0.0028)), C(0.05, 0.4, 0.35, 0.1, 0, 0.4));
  // mouth: a line from the lips' parting to the corner; the corner lifts with a smile
  const smile = smileAt(id, t);
  const m0 = px(0.093, -0.066, 0.0), m1 = px(0.088, -0.0665, 0.012 * near), m2 = px(0.079, -0.066 + 0.004 * smile, 0.022 * near);
  pen.stroke(poly(curve([m0, m1, m2], false, 4), false), C(0.05, 0.7, 0.45, 0.1, 0, 0.6), lw(0.0045));
  // lips: a little colour on the lip line
  const l0 = px(0.095, -0.062, 0.004 * near), l1 = px(0.093, -0.074, 0.004 * near);
  pen.fill(ellipsePath((l0[0] + l1[0]) / 2, (l0[1] + l1[1]) / 2, lw(0.006), lw(0.008)), lk.lip, 'add', 0.8);
}

/* blinks: ~0.12 s, every few seconds, offset per person */
const BLINKS = { hana: [3.1, 6.4, 9.2, 12.9, 14.3], liam: [2.4, 5.8, 8.7, 11.4, 13.7] };
function blinkAt(id, t) {
  let b = 0;
  for (const t0 of BLINKS[id]) { const u = (t - t0) / 0.14; if (u > 0 && u < 1) b = Math.max(b, Math.sin(Math.PI * u) ** 0.7); }
  return b;
}
function smileAt(id, t) { return smoother((t - (id === 'hana' ? 12.95 : 13.25)) / 0.9); }

/* ── torso, arms, legs ────────────────────────────────────────────────────── */
function torsoRings(w, ps, id) {
  const pf = frameH(ps.pp.h + (vdot(ps.pelFr.f, [0, 0, 1]) * 0)), pel = ps.pel, D = w.dims;
  const pelFr = ps.pelFr, chFr = ps.chestFr;
  const at = (fr, o, y, df, wr, cf = 0, n = 18) => ringPts(L2W(fr, o, cf, y, 0), fr, df, wr, n);
  const br = 1 + 0.012 * ps.breath;
  if (id === 'hana') {
    const lag = w.lag(ps.t);
    return [
      at(pelFr, pel, 0.765 - D.hipH, 0.124, 0.17, -0.004 + lag * 0.4),
      at(pelFr, pel, 0.86 - D.hipH, 0.112, 0.168),
      at(chFr, pel, 1.03 - D.hipH, 0.096 * br, 0.136),
      at(chFr, pel, 1.2 - D.hipH, 0.114 * br, 0.142, 0.016),
      at(chFr, pel, 1.31 - D.hipH, 0.095 * br, 0.158, 0.004),
      at(chFr, pel, 1.37 - D.hipH, 0.068, 0.152, -0.012),
      at(chFr, pel, 1.43 - D.hipH, 0.048, 0.056, -0.006),
    ];
  }
  const lag = w.lag(ps.t);
  return [
    at(pelFr, pel, 0.79 - D.hipH, 0.13, 0.19, lag * 0.3),
    at(pelFr, pel, 0.88 - D.hipH, 0.118, 0.178),
    at(chFr, pel, 1.05 - D.hipH, 0.112 * br, 0.168),
    at(chFr, pel, 1.22 - D.hipH, 0.126 * br, 0.184, 0.014),
    at(chFr, pel, 1.33 - D.hipH, 0.11 * br, 0.206, 0.004),
    at(chFr, pel, 1.385 - D.hipH, 0.08, 0.2, -0.012),
    at(chFr, pel, 1.45 - D.hipH, 0.062, 0.068, -0.004),
  ];
}

function drawArm(w, ps, side, lk, id, S) {
  const A = ps.arms[side], isH = id === 'hana';
  const sleeveR = isH ? [0.056, 0.048, 0.046] : [0.06, 0.052, 0.047];
  const c = P2(A.elbow);
  const rim = Math.max(1.4, 0.012 * S);
  // hand first (the cuff overlaps it)
  const hd = A.handDir, fr = ps.chestFr;
  const k1 = vmad(A.wrist, hd, 0.035), k2 = vmad(A.wrist, hd, 0.078);
  const thumb = vmad(vmad(A.wrist, hd, 0.03), fr.f, 0.025);
  const hs = 1 - (A.handIn || 0);
  if (hs > 0.05) {
    const hand = capsule([vmad(A.wrist, hd, 0.005), vmad(A.wrist, hd, 0.035 * hs), vmad(A.wrist, hd, 0.078 * hs), vmad(vmad(A.wrist, hd, 0.03 * hs), fr.f, 0.025 * hs)], [0.026, 0.03 * (0.5 + hs / 2), 0.022 * hs, 0.014 * hs]);
    litFill(hand, lk.skin, lk.skinLit, c[0], c[1], rim * 0.8);
  }
  const cuff = vmad(A.wrist, hd, isH ? 0.012 : -0.005);
  const sleeve = capsule([A.sh, A.elbow, cuff], sleeveR);
  litFill(sleeve, lk.top, lk.topLit, c[0], c[1], rim);
  // a crease at the elbow and the cuff edge
  const e0 = P2(A.elbow), cf = P2(cuff);
  pen.save(); pen.clip(sleeve);
  const dark = cover(lk.top, C(0, 0.1, 0.05, 0.12, 0, 0.18));
  pen.fill(ellipsePath(e0[0], e0[1], sleeveR[1] * S * 0.55, sleeveR[1] * S * 0.25), dark, 'put', 0.5);
  pen.fill(ellipsePath(cf[0], cf[1], sleeveR[2] * S * 1.05, sleeveR[2] * S * 1.05), dark, 'put', 0.35);
  pen.restore();
}

function footOutline(w, fs) {
  // shoe outline in its local side plane: rear part pitched, toe part bent back to the ground
  const G = footGeom(w), fr = frameH(fs.yaw);
  const c = Math.cos(fs.pitch), s = Math.sin(fs.pitch);
  const toWorld = (x, y, z) => {  // local to ankle: x forward, y up (relative to ankle), z right
    const X = x * c - y * s, Y = x * s + y * c;
    return [fs.ankle[0] + fr.f[0] * X + fr.r[0] * z, fs.ankle[1] + Y, fs.ankle[2] + fr.f[2] * X + fr.r[2] * z];
  };
  const ah = G.ah, ball = G.ball, toe = G.toe, heel = G.heel;
  // the toe box rotates about the ball joint by the bend
  const tb = fs.toeBend, cb = Math.cos(tb), sb = Math.sin(tb);
  const toeW = (x, y, z) => { const dx = x - ball, dy = y + ah; return toWorld(ball + dx * cb - dy * sb, -ah + dx * sb + dy * cb, z); };
  return { toWorld, toeW, ah, ball, toe, heel };
}
function drawShoe(w, fs, lk, id, S) {
  const O = footOutline(w, fs), isH = id === 'hana';
  const wdt = isH ? 0.043 : 0.05, ht = isH ? 0.065 : 0.085;
  const pts = [];
  for (const z of [-wdt, wdt]) {
    pts.push(O.toWorld(O.heel - 0.004, -O.ah, z * 0.8), O.toWorld(O.heel - 0.008, -O.ah + 0.03, z * 0.85),
      O.toWorld(O.heel + 0.01, -O.ah + ht, z * 0.8), O.toWorld(0.03, -O.ah + ht * 0.95, z * 0.9),
      O.toWorld(O.ball - 0.03, -O.ah + 0.045, z), O.toWorld(O.ball, -O.ah, z));
    pts.push(O.toeW(O.ball + 0.01, -O.ah + 0.042, z * 0.95), O.toeW(O.toe - 0.015, -O.ah + 0.03, z * 0.7),
      O.toeW(O.toe, -O.ah + 0.01, z * 0.4), O.toeW(O.toe - 0.01, -O.ah, z * 0.6), O.toeW(O.ball + 0.02, -O.ah, z));
  }
  const shoe = hull3(pts);
  const c = P2(fs.ankle);
  litFill(shoe, lk.shoe, lk.shoeLit, c[0], c[1], Math.max(1.3, 0.01 * S));
  // sole
  const sole = hull3([O.toWorld(O.heel - 0.004, -O.ah, -wdt * 0.8), O.toWorld(O.heel - 0.004, -O.ah, wdt * 0.8),
    O.toWorld(O.heel - 0.004, -O.ah + 0.018, 0), O.toWorld(O.ball, -O.ah + 0.012, 0), O.toWorld(O.ball, -O.ah, wdt),
    O.toWorld(O.ball, -O.ah, -wdt), O.toeW(O.toe - 0.004, -O.ah + 0.008, 0), O.toeW(O.toe - 0.01, -O.ah, 0)]);
  pen.save(); pen.clip(shoe); pen.fill(sole, lk.sole, 'put', 0.9); pen.restore();
}

function drawLeg(w, ps, side, lk, id, S) {
  const hip = side < 0 ? ps.hipL : ps.hipR, knee = side < 0 ? ps.kneeL : ps.kneeR, ank = side < 0 ? ps.ankL : ps.ankR;
  const fs = side < 0 ? ps.footL : ps.footR;
  const c = P2(knee), rim = Math.max(1.3, 0.011 * S);
  if (id === 'hana') {
    // bare lower leg below the skirt
    const calf = vlerp(knee, ank, 0.3);
    const leg = capsule([knee, calf, ank], [0.048, 0.05, 0.031]);
    litFill(leg, lk.leg, lk.legLit, c[0], c[1], rim);
    drawShoe(w, fs, lk, id, S);
  } else {
    const mid = vlerp(hip, knee, 0.45), calf = vlerp(knee, ank, 0.32), hem = vmad(ank, [0, 1, 0], 0.02);
    const leg = capsule([hip, mid, knee, calf, hem], [0.074, 0.066, 0.051, 0.05, 0.046]);
    drawShoe(w, fs, lk, id, S);
    litFill(leg, lk.pants, lk.pantsLit, c[0], c[1], rim);
    // knee crease and hem shadow
    const k = P2(knee);
    pen.save(); pen.clip(leg);
    pen.fill(ellipsePath(k[0], k[1] + 0.02 * S, 0.035 * S, 0.012 * S), cover(lk.pants, C(0, 0, 0, 0.1, 0, 0.25)), 'put', 0.6);
    const hm = P2(hem);
    pen.fill(ellipsePath(hm[0], hm[1], 0.06 * S, 0.012 * S), C(0.05, 0.05, 0.05, 0.6, 0, 0.3), 'put', 0.5);
    pen.restore();
  }
}

function drawSkirt(w, ps, lk, S) {
  const D = w.dims, pf = ps.pelFr, pel = ps.pel, lag = w.lag(ps.t);
  const waistY = 1.0, hemY = 0.36 + 0.004 * Math.sin(ps.t * 3);
  const waist = ringPts(L2W(pf, pel, 0, waistY - D.hipH, 0), pf, 0.1, 0.14, 24);
  // hem: base ellipse pushed out by the legs where they cross the hem height
  const hc = L2W(pf, [pel[0], hemY, pel[2]], lag * 1.4 - 0.01, 0, 0);
  const legAt = (hip, knee, ank) => {
    const pts = [hip, knee, ank];
    for (let i = 0; i < 2; i++) {
      const a = pts[i], b = pts[i + 1];
      if ((a[1] - hemY) * (b[1] - hemY) <= 0) { const u = (a[1] - hemY) / (a[1] - b[1]); return vlerp(a, b, u); }
    }
    return knee;
  };
  const legs = [legAt(ps.hipL, ps.kneeL, ps.ankL), legAt(ps.hipR, ps.kneeR, ps.ankR)];
  const n = 36, rad = new Float64Array(n), hem = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU, dir = vadd(vmul(pf.f, Math.cos(a)), vmul(pf.r, Math.sin(a)));
    let r = 0.27 + 0.02 * Math.cos(a) ;
    for (const lp of legs) {
      const rel = vsub(lp, hc); rel[1] = 0;
      const along = vdot(rel, dir), perp = vlen(vsub(rel, vmul(dir, along)));
      if (along > 0) r = Math.max(r, along + 0.085 - perp * 0.35);
    }
    rad[i] = r;
  }
  for (let pass = 0; pass < 3; pass++) { const c = rad.slice(); for (let i = 0; i < n; i++) rad[i] = (c[(i + n - 1) % n] + 2 * c[i] + c[(i + 1) % n]) / 4; }
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU, dir = vadd(vmul(pf.f, Math.cos(a)), vmul(pf.r, Math.sin(a)));
    const pleat = 0.006 * (i % 2 ? 1 : -1);
    hem.push(vadd(vmad(hc, dir, rad[i] + pleat), [0, 0.01 * Math.max(0, Math.cos(a)) * (rad[i] - 0.27) * 4, 0]));
  }
  const skirt = hull3(waist.concat(hem));
  const c = P2(pel);
  litFill(skirt, lk.skirt, lk.skirtLit, c[0], c[1], Math.max(1.5, 0.012 * S));
  // pleats: lines from waist to hem on the side facing the lens, and the scalloped hem edge
  pen.save(); pen.clip(skirt);
  const toCam = (p) => vnorm(vsub([CAM.x, CAM.y, CAM.z], p));
  const pleatC = cover(lk.skirt, C(0, 0.1, 0.0, 0.2, 0, 0.35));
  for (let i = 0; i < n; i += 2) {
    const a = i / n * TAU, dir = vadd(vmul(pf.f, Math.cos(a)), vmul(pf.r, Math.sin(a)));
    if (vdot(dir, toCam(hem[i])) < 0.05) continue;
    const top = L2W(pf, pel, Math.cos(a) * 0.1, waistY - D.hipH, Math.sin(a) * 0.14);
    const a0 = P2(top), a1 = P2(hem[i]);
    pen.stroke(poly([[a0[0], a0[1]], [lerp(a0[0], a1[0], 0.5), lerp(a0[1], a1[1], 0.5)], [a1[0], a1[1]]], false), pleatC, Math.max(0.8, 0.005 * S), 'put', 0.8);
  }
  // darker inside the hem where it turns away
  const hemPts = hem.map(P2);
  const lowY = Math.max(...hemPts.map(p => p[1]));
  pen.fill(skirt, { lin: [0, lowY - 0.12 * S, 0, lowY], stops: [[0, C(), 0], [1, C(0, 0.05, 0, 0.2, 0, 0.3), 1]] }, 'add');
  pen.restore();
}

function drawTorso(w, ps, lk, id, S) {
  const rings = torsoRings(w, ps, id);
  const body = hull3(rings.flat());
  const c = P2(ps.chest);
  litFill(body, lk.top, lk.topLit, c[0], c[1], Math.max(1.6, 0.013 * S));
  const pf = ps.chestFr, pel = ps.pel, D = w.dims;
  const toCam = vnorm(vsub([CAM.x, CAM.y, CAM.z], ps.chest));
  pen.save(); pen.clip(body);
  // ambient occlusion toward the hem and under the arms
  const hemP = P2(rings[0][0]), topP = P2(rings[4][0]);
  pen.fill(body, { lin: [0, topP[1], 0, hemP[1] + 0.02 * S], stops: [[0, C(), 0], [0.6, C(), 0], [1, C(0, 0.06, 0.02, 0.12, 0, 0.16), 1]] }, 'add');
  if (id === 'hana') {
    // cardigan: open front showing the pale top, a placket on each side
    const V = (a, y, c) => L2W(pf, pel, a, y - D.hipH, c);
    const nk = [V(0.035, 1.415, -0.035), V(0.06, 1.3, -0.02), V(0.1, 1.17, -0.01), V(0.105, 1.1, 0.0),
      V(0.1, 1.17, 0.01), V(0.06, 1.3, 0.02), V(0.035, 1.415, 0.035)];
    if (vdot(pf.f, toCam) > -0.2) {
      const opening = poly(nk.map(P2).map(q => [q[0], q[1]]));
      pen.fill(opening, lk.inner);
      const plk = cover(lk.top, C(0, 0.08, 0.05, 0.1, 0, 0.16));
      for (const sgn of [-1, 1]) {
        const line = [V(0.04, 1.42, sgn * 0.04), V(0.1, 1.2, sgn * 0.012), V(0.108, 1.04, sgn * 0.002), V(0.118, 0.86, sgn * 0.01), V(0.125, 0.77, sgn * 0.02)].map(P2).map(q => [q[0], q[1]]);
        pen.stroke(poly(curve(line, false, 4), false), plk, Math.max(1, 0.012 * S), 'put', 0.85);
      }
    }
  } else {
    const V = (a, y, c) => L2W(pf, pel, a, y - D.hipH, c);
    if (vdot(pf.f, toCam) > -0.2) {
      // sweater at the collar, placket, patch pockets
      const nk = [V(0.045, 1.44, -0.05), V(0.075, 1.36, -0.02), V(0.08, 1.33, 0), V(0.075, 1.36, 0.02), V(0.045, 1.44, 0.05)];
      pen.fill(poly(nk.map(P2).map(q => [q[0], q[1]])), lk.inner);
      const dk = cover(lk.top, C(0, 0.05, 0.05, 0.15, 0.05, 0.3));
      const pl = [V(0.08, 1.33, 0.0), V(0.128, 1.18, 0.0), V(0.118, 1.04, 0.0), V(0.13, 0.86, 0), V(0.132, 0.79, 0)].map(P2).map(q => [q[0], q[1]]);
      pen.stroke(poly(curve(pl, false, 4), false), dk, Math.max(1, 0.006 * S), 'put', 0.9);
      for (const sgn of [-1, 1]) {
        const pk = [V(0.132, 0.98, sgn * 0.04), V(0.132, 0.98, sgn * 0.14), V(0.13, 0.84, sgn * 0.145), V(0.132, 0.84, sgn * 0.04)].map(P2).map(q => [q[0], q[1]]);
        pen.stroke(poly(pk), dk, Math.max(0.9, 0.005 * S), 'put', 0.75);
      }
      // collar points
      for (const sgn of [-1, 1]) {
        const cl = [V(0.02, 1.47, sgn * 0.07), V(0.07, 1.39, sgn * 0.03), V(0.09, 1.34, sgn * 0.075), V(0.03, 1.41, sgn * 0.1)].map(P2).map(q => [q[0], q[1]]);
        pen.fill(poly(cl), cover(lk.top, C(0, 0, 0, 0.05, 0, 0.1)));
        pen.stroke(poly(cl), dk, Math.max(0.8, 0.004 * S), 'put', 0.7);
      }
    }
  }
  pen.restore();
}

/* ── the whole figure ─────────────────────────────────────────────────────── */
function drawFigure(w, id, ps, rimK = 1) {
  const lk = LOOK[id], S = P2(ps.chest)[2];
  SIL = new Path2D();
  // which side faces the lens: the far limbs go first
  const toCam = vsub([CAM.x, CAM.y, CAM.z], ps.pel);
  const nearSide = vdot(ps.chestFr.r, toCam) > 0 ? 1 : -1, farSide = -nearSide;
  drawArm(w, ps, farSide, lk, id, S);
  drawLeg(w, ps, farSide, lk, id, S);
  drawLeg(w, ps, nearSide, lk, id, S);
  if (id === 'hana') drawSkirt(w, ps, lk, S);
  drawTorso(w, ps, lk, id, S);
  drawHead(w, ps, lk, id);
  drawArm(w, ps, nearSide, lk, id, S);
  const c = P2(ps.chest);
  if (rimK > 0) rimPass(SIL, c[0], c[1], Math.max(1.6, 0.013 * S), rimK);
  SIL = null;
}

/* ── cast shadow on the ground, toward the lens from the low sun ───────────
   Each part's ground shadow is its capsule projected along the sunlight onto
   y = 0, clipped before the lens, then projected: perspective-exact.       */
function groundShadowPts(pts3, radii) {
  const cot = 1 / Math.tan(SUN.elev), zc = CAM.z + 1.2;
  const out = [];
  pts3.forEach((p, i) => {
    let gz = p[2] - p[1] * cot, gx = p[0];
    if (gz < zc) gz = zc;
    const r = radii[i];
    for (let k = 0; k < 10; k++) { const a = k / 10 * TAU; out.push(P2([gx + Math.cos(a) * r, 0, gz + Math.sin(a) * r])); }
  });
  return hull(out.map(q => [q[0], q[1]]));
}
function drawFigureShadow(w, id, ps, col, k = 1) {
  // only the legs and feet print: everything higher falls beyond the frame at this sun
  const parts = new Path2D();
  const legs = [[ps.kneeL, ps.ankL], [ps.kneeR, ps.ankR]];
  for (const [kn, a] of legs) parts.addPath(poly(groundShadowPts([kn, a], [0.05, 0.045])));
  for (const fs of [ps.footL, ps.footR]) {
    const O = footOutline(w, fs);
    parts.addPath(poly(groundShadowPts([O.toWorld(O.heel, -O.ah, 0), O.toeW(O.toe - 0.02, -O.ah + 0.01, 0), fs.ankle], [0.04, 0.04, 0.045])));
  }
  const f = P2([ps.pel[0], 0, ps.pel[2]]);
  // long shadows soften and fade with distance from the feet
  pen.fill(parts, { lin: [0, f[1] - 6, 0, f[1] + 0.32 * f[2]], stops: [[0, C(0.05, 0.3, 0.3, 0.12, 0, 0.5), k], [0.35, C(0.05, 0.25, 0.25, 0.1, 0, 0.4), k * 0.6], [1, C(), 0]] }, 'add');
}

/* ════ scene.js ════ */
/* ── Halfway · the two worlds ───────────────────────────────────────────────
   One sky, one sun, split at world X = 0.

   Left (X < 0): a thatched minka in the Japanese countryside at sunrise:
   cedar mountains, harvested terraces with rice drying on racks, a Japanese
   maple, a persimmon tree, a stone lantern, persimmons drying under the eaves.
   Right (X > 0): an Ontario brick farmhouse at sunset: a lake, spruce and
   birch on the Shield hills, a sugar maple, a split-rail fence, a canoe.

   The sun stands low on the seam, rising for one house and setting for the
   other. Everything the lens sees is backlit, so each home throws a long
   shadow strip toward the viewer (shadows radiate from the sun's point on
   the horizon). Between the strips runs one corridor of light down the
   middle of the frame, capped by a sun pillar in the sky: that is the
   dividing line, and it is where the two walkers meet.

   All geometry is in world metres and projected every frame, so the slow
   dolly gives exact parallax without resizing any screened bitmap.        */

/* ── palette (plate coverages) ─────────────────────────────────────────────── */
const PAL = {
  haze: C(0.52, 0.2, 0.38),
  thatch: C(0.45, 0.16, 0.45, 0, 0, 0.26), thatchDk: C(0.35, 0.3, 0.55, 0, 0, 0.55), thatchEdge: C(0.55, 0.1, 0.42, 0, 0, 0.12),
  wood: C(0.1, 0.35, 0.5, 0, 0, 0.72), woodLt: C(0.2, 0.22, 0.45, 0, 0, 0.42),
  plaster: C(0.1, 0, 0.08, 0, 0, 0.14), stone: C(0.12, 0, 0, 0.3, 0, 0.32),
  shoji: C(0.65, 0, 0.24), shojiDim: C(0.5, 0.06, 0.3, 0, 0, 0.08),
  brick: C(0.08, 0.55, 0.7, 0, 0, 0.3), brickDk: C(0.08, 0.55, 0.7, 0, 0, 0.52),
  trim: C(0.06, 0, 0.04, 0, 0, 0.1), shingle: C(0, 0.18, 0, 0.35, 0, 0.55),
  glow: C(0.66, 0, 0.32), shutter: C(0.05, 0, 0, 0.3, 0.72, 0.5),
  momiji: C(0.12, 0.8, 0.86), momijiLt: C(0.45, 0.4, 0.72), momijiDk: C(0.05, 0.8, 0.8, 0, 0, 0.36),
  sugar: C(0.55, 0.38, 0.86), sugarLt: C(0.8, 0.1, 0.5), sugarDk: C(0.35, 0.6, 0.82, 0, 0, 0.28),
  bark: C(0.1, 0.3, 0.4, 0, 0, 0.72), spruce: C(0.06, 0, 0, 0.3, 0.72, 0.58), cedar: C(0.08, 0, 0, 0.35, 0.6, 0.6),
  birch: C(0.06, 0, 0.04, 0, 0, 0.08),
  moss: C(0.45, 0.06, 0.2, 0, 0.34, 0.26), earth: C(0.32, 0.14, 0.4, 0, 0, 0.3),
  grass: C(0.55, 0.06, 0.34, 0, 0.12, 0.16), gravel: C(0.25, 0.1, 0.28, 0.08, 0, 0.26),
  meadow: C(0.52, 0.06, 0.28, 0, 0.2, 0.16),
  stubble: C(0.55, 0.1, 0.34, 0, 0, 0.1), shadow: C(0, 0.06, 0, 0.28, 0, 0.3),
};

/* ── 3D helpers ─────────────────────────────────────────────────────────────── */
const pj = (x, y, z) => { const s = proj(x, y, z); return [s[0], s[1]]; };
const Q3 = (pts) => poly(pts.map(p => pj(p[0], p[1], p[2])));
const L3 = (pts) => poly(pts.map(p => pj(p[0], p[1], p[2])), false);
// rectangle in a plane of constant z
const rectZ = (x0, x1, y0, y1, z) => Q3([[x0, y0, z], [x1, y0, z], [x1, y1, z], [x0, y1, z]]);
// rectangle in a plane of constant x
const rectX = (x, z0, z1, y0, y1) => Q3([[x, y0, z0], [x, y0, z1], [x, y1, z1], [x, y1, z0]]);
// ground polygon from (x, z) pairs, clipped in front of the lens
function groundPoly(xz, y = 0) {
  const zc = CAM.z + 1.0, out = [];
  for (let i = 0; i < xz.length; i++) {
    const a = xz[i], b = xz[(i + 1) % xz.length];
    const ain = a[1] >= zc, bin = b[1] >= zc;
    if (ain) out.push(a);
    if (ain !== bin) { const u = (zc - a[1]) / (b[1] - a[1]); out.push([lerp(a[0], b[0], u), zc]); }
  }
  return poly(out.map(p => pj(p[0], y, p[1])));
}
const wz = (key, t, hz, amp) => wander(key, t, hz) * amp;

/* ── the sun and what it lights ─────────────────────────────────────────────── */
// Occluders between the sun and the foreground: [x0, x1, z, dapple]
const OCC = [
  [-16.6, -3.9, 34, 0],       // minka and its eaves
  [-6.4, -3.1, 26, 0.45],     // Japanese maple canopy
  [-19.3, -15.2, 30, 0.5],    // persimmon
  [-6.62, -6.25, 18, 0],      // stone lantern
  [4.8, 15.2, 34.8, 0],       // farmhouse and porch
  [2.6, 7.1, 27, 0.4],        // sugar maple
  [15.6, 19.8, 30, 0.55],     // birches
];
// strips with dapple gaps, built once
let STRIPS = null;
function buildStrips() {
  STRIPS = [];
  OCC.forEach(([x0, x1, z, dap], k) => {
    if (!dap) { STRIPS.push([x0, x1, z]); return; }
    const r = rngFor('dapple' + k);
    let x = x0;
    while (x < x1) {
      const run = 0.12 + r() * 0.5, gap = r() < dap ? 0.05 + r() * 0.2 : 0;
      STRIPS.push([x, Math.min(x1, x + run), z]);
      x += run + gap;
    }
  });
}
// how much sun reaches a point on the ground at (X, Z): 0 shadow, 1 full sun
function sunAt(X, Z) {
  let lit = 1;
  for (const [x0, x1, z] of STRIPS) {
    if (Z >= z) continue;
    const pen = 0.06 + (z - Z) * 0.012;      // penumbra widens with distance from the occluder
    const inside = Math.min(smooth((X - x0 + pen) / (2 * pen)), smooth((x1 - X + pen) / (2 * pen)));
    lit = Math.min(lit, 1 - inside);
  }
  return lit;
}

/* ── sky ───────────────────────────────────────────────────────────────────── */
function drawSky(t) {
  // one sky across both halves; cooler dawn above the left, warmer dusk above the right
  const top = CY + 4;
  pen.rect(0, 0, W, top, { lin: [0, 0, 0, top], stops: [[0, C(0.0, 0.18, 0, 0.55, 0, 0.32)], [0.4, C(0.02, 0.3, 0.08, 0.34, 0, 0.14)], [0.72, C(0.22, 0.34, 0.26, 0.08)], [1, C(0.6, 0.22, 0.42)]] });
  pen.rect(0, 0, W / 2, top, { lin: [0, 0, W / 2, 0], stops: [[0, C(0, 0.04, 0, 0.12, 0, 0.14), 1], [1, C(), 0]] }, 'add');
  pen.rect(W / 2, 0, W / 2, top, { lin: [W / 2, 0, W, 0], stops: [[0, C(), 0], [1, C(0.08, 0.14, 0.14), 1]] }, 'add');
  // the glow round the sun: lift the blues, add yellow
  const g = 1 + 0.04 * wz('glow', t, 0.2, 1);
  pen.fill(ellipsePath(SUN.x, SUN.y, 900, 420), { rad: [SUN.x, SUN.y, 20, SUN.x, SUN.y, 560 * g], stops: [[0, C(0.2, 0.4, 0.2, 1, 1, 1)], [0.3, C(0.05, 0.25, 0.1, 0.75, 0, 0.75)], [1, C(0, 0, 0, 0, 0, 0)]] }, 'lift');
  pen.fill(ellipsePath(SUN.x, SUN.y, 900, 420), { rad: [SUN.x, SUN.y, 20, SUN.x, SUN.y, 460 * g], stops: [[0, C(0.8, 0, 0.3)], [0.3, C(0.35, 0.02, 0.16)], [1, C(0, 0, 0)]] }, 'add');
  // sun pillar: a column of light standing on the sun (the seam), fading upward
  const pil = 0.55 + 0.45 * smoother(t / 3.2);
  const slices = 36;
  for (let k = 0; k < slices; k++) {
    const y0 = SUN.y * k / slices, y1 = SUN.y * (k + 1) / slices, v = (k + 0.5) / slices;
    const pw = (15 + 7 * v + 3 * wz('pillar', t + v, 0.17, 1)) * (0.85 + 0.3 * v);
    const a = pil * (0.25 + 0.75 * Math.pow(v, 1.3));
    const sl = new Path2D(); sl.rect(SUN.x - pw * 3, y0, pw * 6, y1 - y0 + 0.5);
    const st = [], st2 = [];
    for (let i = 0; i <= 12; i++) {
      const u = i / 12, g = Math.exp(-(((u - 0.5) * 6) ** 2)) * a;
      st.push([u, C(0, 0.6 * g, 0.3 * g, 0.95 * g, 0, 0.95 * g)]); st2.push([u, C(0.6 * g, 0, 0.1 * g)]);
    }
    pen.fill(sl, { lin: [SUN.x - pw * 3, 0, SUN.x + pw * 3, 0], stops: st }, 'lift');
    pen.fill(sl, { lin: [SUN.x - pw * 3, 0, SUN.x + pw * 3, 0], stops: st2 }, 'add');
  }
  drawClouds(t);
  drawMoon(t); drawGeese(t);
}
function drawSun(t) {    // the sun itself, sitting in the notch between the ranges
  const r = 44;
  pen.fill(ellipsePath(SUN.x, SUN.y, r * 1.5, r * 1.5), { rad: [SUN.x, SUN.y, r, SUN.x, SUN.y, r * 1.5], stops: [[0, C(0.7, 0, 0.15)], [1, C(0.7, 0, 0.15), 0]] }, 'mix');
  pen.fill(ellipsePath(SUN.x, SUN.y, r, r), { rad: [SUN.x - 8, SUN.y - 10, 0, SUN.x, SUN.y, r], stops: [[0, C(0.85, 0, 0.05)], [1, C(0.95, 0.1, 0.42)]] });
}
function drawClouds(t) {
  const r = rngFor('clouds');
  for (let i = 0; i < 16; i++) {
    const side = i < 8 ? -1 : 1;
    const y = 90 + r() * 280, len = 180 + r() * 360;
    const x = side < 0 ? 40 + r() * 760 : 1120 + r() * 760;
    const drift = t * (6 + r() * 5) * side * 0.6;
    const th = 5 + r() * 9;
    const cx = x + drift, pts = [];
    for (let k = 0; k <= 12; k++) { const u = k / 12; pts.push([cx - len / 2 + u * len, y + Math.sin(u * 7 + i) * 2]); }
    const shape = nib(pts, (u) => th * Math.pow(Math.sin(Math.PI * u), 0.7) * (0.8 + 0.2 * Math.sin(u * 9 + i)));
    // underlit: warm near the sun, violet away from it
    const near = 1 - clamp(Math.abs(cx - CX) / 900, 0, 1) * 0.7 - clamp((CY - y) / 500, 0, 0.5);
    const col = cmix(C(0.05, 0.42, 0.22, 0.28, 0, 0.15), C(0.35, 0.45, 0.45, 0.02, 0, 0.02), clamp(near, 0, 1));
    pen.fill(shape, col);
    // a lit lower lip
    const lip = nib(pts.map(([px, py]) => [px, py + th * 0.35]), (u) => th * 0.35 * Math.pow(Math.sin(Math.PI * u), 0.9));
    pen.fill(lip, cmix(col, C(0.7, 0.15, 0.4), 0.6));
  }
}
function drawMoon(t) {   // a pale morning moon over the Japanese side
  const x = 250, y = 150, r = 17;
  const moon = ellipsePath(x, y, r, r);
  const bite = ellipsePath(x + 9, y - 4, r * 0.95, r * 0.95);
  pen.save(); pen.clip(moon);
  const m = new Path2D(); m.rect(x - r - 2, y - r - 2, r * 2 + 4, r * 2 + 4); m.addPath(bite);
  pen.fill(m, C(0.12, 0.05, 0.05, 0.1, 0, 0.12), 'put', 1, 'evenodd');
  pen.restore();
}
function drawGeese(t) { // a skein crossing the evening sky over the Canadian side
  const n = 11, lead = [1880 - t * 38, 175 + t * 1.8];
  for (let i = 0; i < n; i++) {
    const rank = Math.ceil(i / 2), arm = i % 2 ? 1 : -1;
    const x = lead[0] + rank * 22 + wz('gx' + i, t, 0.4, 2), y = lead[1] + rank * 11 * arm * (arm > 0 ? 1 : 0.8) + wz('gy' + i, t, 0.3, 2);
    if (x < W / 2 + 60) continue;
    const flap = Math.sin(t * 7.5 + i * 1.3) * 3.2;
    const g = poly([[x - 6, y - flap], [x - 1.5, y + 0.8], [x + 2.5, y - 0.2], [x + 6.5, y - flap * 0.9], [x + 2, y + 2], [x - 1.5, y + 2.2]]);
    pen.fill(g, C(0.05, 0.3, 0.15, 0.45, 0, 0.6));
  }
}

/* ── far ranges (at infinity: static) ─────────────────────────────────────── */
let RANGES = null;
function buildRanges() {
  const ridge = (key, x0, x1, fn, step = 6) => {
    const r = rngFor(key), pts = [];
    let n1 = 0, n2 = 0;
    for (let x = x0; x <= x1 + 0.1; x += step) {
      n1 = n1 * 0.85 + (r() - 0.5) * 3; n2 = n2 * 0.6 + (r() - 0.5) * 2;
      pts.push([x, fn(x) + n1 + n2]);
    }
    return pts;
  };
  const close = (pts) => poly(pts.concat([[pts[pts.length - 1][0], CY + 60], [pts[0][0], CY + 60]]));
  const seamL = (x) => clamp((CX - x) / 200, 0, 1), seamR = (x) => clamp((x - CX) / 200, 0, 1);
  // Japan: steep, layered, forested; the ridges fall to the notch where the sun sits
  const jFar = ridge('jfar', -20, 980, x => CY - 330 * Math.pow(seamL(x - 10) * 0.9 + 0.1, 0.8) * (0.72 + 0.28 * Math.sin(x / 150 + 1)) - 10, 5);
  const jMid = ridge('jmid', -20, 980, x => CY - 230 * Math.pow(seamL(x + 40), 0.9) * (0.6 + 0.4 * Math.abs(Math.sin(x / 210 + 2.2))) + 4, 4);
  const jNear = ridge('jnear', -20, 980, x => CY - 120 * Math.pow(seamL(x + 70), 1.1) * (0.55 + 0.45 * Math.abs(Math.sin(x / 130 + 0.4))) + 8, 3);
  // Canada: low rounded Shield hills

  const ye = rngFor('yard'), yard = new Path2D();
  for (let i = 0; i < 80; i++) {

function drawPath(id, col) {
  const w = WALKERS[id], L = w.L;
  const left = [], right = [], r = rngFor('path' + id);
  for (let d = L + 0.6; d >= L - 17; d -= 0.25) {
    const p = w.path(d), fr = frameH(p.h), hw = 0.42 + 0.05 * Math.sin(d * 1.3) + (r() - 0.5) * 0.03;
    left.push([p.x - fr.r[0] * hw, p.z - fr.r[2] * hw]); right.push([p.x + fr.r[0] * hw, p.z + fr.r[2] * hw]);
  }
  pen.fill(groundPoly(left.concat(right.reverse())), col);
  if (id === 'hana') {   // stepping stones set into the path
    for (let d = L - 1.2; d > L - 17; d -= 0.62 + r() * 0.1) {
      const p = w.path(d), fr = frameH(p.h), s = 0.2 + r() * 0.06, o = (r() - 0.5) * 0.12;

      const d = L + 0.5 - Math.pow(r(), 0.8) * 17, p = w.path(d), fr = frameH(p.h), o = (r() - 0.5) * 0.8, s = 0.02 + r() * 0.03;

  thatchStrokes(upper, 'tu', 50, 0.9);
  // eave cut edge: the thick lighter band of cut bundle ends
  const edge = Q3([[e.eaveX0 + 0.6, e.eaveY + 0.5, e.eaveZ], [e.eaveX1 - 0.6, e.eaveY + 0.5, e.eaveZ], [e.eaveX1 - 0.3, e.eaveY - 0.12, e.eaveZ - 0.1], [e.eaveX0 + 0.3, e.eaveY - 0.12, e.eaveZ - 0.1]]);
  pen.fill(edge, PAL.thatchEdge);
  const ends = new Path2D(), re = rngFor('ends');
  for (let x = e.eaveX0 + 0.5; x < e.eaveX1 - 0.4; x += 0.09 + re() * 0.05) ends.addPath(L3([[x, e.eaveY + 0.45, e.eaveZ], [x + (re() - 0.5) * 0.05, e.eaveY - 0.08, e.eaveZ - 0.1]]));
  pen.stroke(ends, cmix(PAL.thatchEdge, PAL.thatchDk, 0.5), 1, 'put', 0.7);
  const edgeR = Q3([[e.eaveX1 - 0.6, e.eaveY + 0.5, e.eaveZ], [e.eaveX1, e.eaveY + 0.5, e.zb + 1.6], [e.eaveX1 + 0.1, e.eaveY - 0.12, e.zb + 1.6], [e.eaveX1 - 0.3, e.eaveY - 0.12, e.eaveZ - 0.1]]);
  pen.fill(edgeR, cmix(PAL.thatchEdge, PAL.thatchDk, 0.3));
  // ridge cap with its crossed timbers (karasu-odori)
  const rc = [[e.ridgeX0 - 0.2, e.ridgeY - 0.05, e.ridgeZ], [e.ridgeX1 + 0.2, e.ridgeY - 0.05, e.ridgeZ], [e.ridgeX1 + 0.2, e.ridgeY + 0.35, e.ridgeZ], [e.ridgeX0 - 0.2, e.ridgeY + 0.35, e.ridgeZ]];
  pen.fill(Q3(rc), PAL.wood);
  const xs = new Path2D();
  for (let x = e.ridgeX0 + 0.1; x <= e.ridgeX1; x += 0.72) {
    xs.addPath(L3([[x - 0.22, e.ridgeY + 0.75, e.ridgeZ - 0.05], [x + 0.22, e.ridgeY + 0.05, e.ridgeZ - 0.05]]));
    xs.addPath(L3([[x + 0.22, e.ridgeY + 0.75, e.ridgeZ - 0.05], [x - 0.22, e.ridgeY + 0.05, e.ridgeZ - 0.05]]));
  }
  pen.stroke(xs, PAL.wood, Math.max(1.5, ppm(e.ridgeZ) * 0.07));
  // backlight catches the ridge and the hip edge that faces the sun
  rimLine([[e.ridgeX0 - 0.2, e.ridgeY + 0.35, e.ridgeZ], [e.ridgeX1 + 0.2, e.ridgeY + 0.35, e.ridgeZ]], 2);
  rimLine([[e.ridgeX1 + 0.1, e.ridgeY, e.ridgeZ], [e.ridgeX1 + 0.4, e.ridgeY - 1.6, e.ridgeZ + 1.6], [e.eaveX1, e.eaveY + 0.5, e.zb + 1.6]], 2.2);
  // smoke from the irori, leaking out of the gable vent
  smoke(t, [e.ridgeX1 + 0.3, e.ridgeY - 0.7, e.ridgeZ], 'minka', 0.9, -0.2);
}
function latticeZ(x0, x1, y0, y1, z, nx, ny, col, w = 1) {
  const p = new Path2D();
  for (let i = 1; i < nx; i++) { const x = lerp(x0, x1, i / nx); p.addPath(L3([[x, y0, z], [x, y1, z]])); }
  for (let j = 1; j < ny; j++) { const y = lerp(y0, y1, j / ny); p.addPath(L3([[x0, y, z], [x1, y, z]])); }
  pen.stroke(p, col, Math.max(0.8, ppm(z) * 0.03 * w));
}
function latticeX(x, z0, z1, y0, y1, nz, ny, col) {
  const p = new Path2D();
  for (let i = 1; i < nz; i++) { const z = lerp(z0, z1, i / nz); p.addPath(L3([[x, y0, z], [x, y1, z]])); }
  for (let j = 1; j < ny; j++) { const y = lerp(y0, y1, j / ny); p.addPath(L3([[x, y, z0], [x, y, z1]])); }
  pen.stroke(p, col, Math.max(0.8, ppm(z0) * 0.03));
}
function latticeTri(tri, n, col) {
  const [a, b, c] = tri, p = new Path2D();
  for (let i = 1; i < n; i++) { const u = i / n; p.addPath(L3([vlerp(a, b, u), vlerp(c, vlerp(a, b, u), 0.25)])); }
  for (let j = 1; j < 3; j++) { const u = j / 3; p.addPath(L3([vlerp(a, c, u), vlerp(b, c, u)])); }
  pen.stroke(p, col, 1.2);
}
function thatchStrokes(quad, key, n, w) {
  const [a, b, c, d] = quad, r = rngFor(key), p = new Path2D(), q = new Path2D();
  const at = (u, v) => vlerp(vlerp(a, b, u), vlerp(d, c, u), v);
  for (let i = 0; i < n; i++) {
    const u = r(), v = r() * 0.95, len = 0.05 + r() * 0.12;
    (i % 3 ? p : q).addPath(L3([at(u, v), at(u + (r() - 0.5) * 0.01, Math.min(1, v + len))]));
  }
  pen.stroke(p, PAL.thatchDk, w, 'put', 0.55);
  pen.stroke(q, C(0.55, 0.12, 0.35), w * 0.9, 'put', 0.45);
  // horizontal courses
  const cp = new Path2D();
  for (let k = 1; k < 5; k++) { const v = k / 5 + (r() - 0.5) * 0.03; cp.addPath(L3([at(0.02, v), at(0.98, v)])); }
  pen.stroke(cp, PAL.thatchDk, w * 1.1, 'put', 0.35);
}
/* smoke: soft puffs rising and spreading, each on its own life cycle */
function smoke(t, base, key, amount = 1, drift = 0.3) {
  const n = 9, p = new Path2D();
  for (let i = 0; i < n; i++) {
    const period = 6.5, age = fract(t / period + i / n) * period, u = age / period;
    const life = Math.sin(Math.PI * u) ** 1.5;
    const x = base[0] + drift * age * 0.5 + wz(key + 'sx' + i, t, 0.25, 0.25) * u, y = base[1] + age * 0.55, z = base[2];
    const r = (0.25 + age * 0.22) * ppm(z);
    const s = pj(x, y, z);
    p.addPath(ellipsePath(s[0], s[1], r * 1.2, r * 0.8));
    if (life > 0.02) pen.fill(ellipsePath(s[0], s[1], r * 1.2, r * 0.8), C(0.2, 0.2, 0.2, 0.1, 0, 0.1), 'mix', 0.18 * life * amount);
  }
}

/* ── Ontario farmhouse ──────────────────────────────────────────────────────
   Red brick Gothic Revival: side-gabled roof with a steep centre gable and
   a lancet window, cream trim and bargeboards, a full-width verandah on
   turned posts, tall sash windows lit for the evening, brick chimneys.   */
const FH = { x0: 5.2, x1: 14.8, zf: 37.0, zb: 44.5, eaveY: 5.0, ridgeY: 8.3, ridgeZ: 40.75, over: 0.4 };
function drawFarmhouse(t) {
  const F_ = FH;
  // gable end facing the seam (x0 plane): wall, gable triangle
  pen.fill(Q3([[F_.x0, 0, F_.zf], [F_.x0, 0, F_.zb], [F_.x0, F_.eaveY, F_.zb], [F_.x0, F_.ridgeY, F_.ridgeZ], [F_.x0, F_.eaveY, F_.zf]]), PAL.brickDk);
  brickCourses('x', F_.x0, F_.zf, F_.zb, 0.5, F_.eaveY, 'bx');
  pen.fill(rectX(F_.x0, F_.zf, F_.zb, 0, 0.5), PAL.stone);
  sashX(F_.x0, 39.8, 41.6, 1.3, 3.0, t, 'sx1');
  sashX(F_.x0, 40.2, 41.3, 5.3, 6.6, t, 'sx2', true);
  // front wall
  pen.fill(rectZ(F_.x0, F_.x1, 0.5, F_.eaveY, F_.zf), PAL.brick);
  brickCourses('z', F_.zf, F_.x0, F_.x1, 0.5, F_.eaveY, 'bz');
  pen.fill(rectZ(F_.x0, F_.x1, 0, 0.5, F_.zf), PAL.stone);
  // centre gable wall rising through the roof
  const gx = (F_.x0 + F_.x1) / 2, gw = 1.7, gTop = 8.05;
  pen.fill(Q3([[gx - gw, F_.eaveY, F_.zf], [gx + gw, F_.eaveY, F_.zf], [gx + gw, F_.eaveY + 0.3, F_.zf], [gx, gTop, F_.zf], [gx - gw, F_.eaveY + 0.3, F_.zf]]), PAL.brick);
  // front roof slopes on each side of the gable
  const rf = (xa, xb) => Q3([[xa, F_.eaveY, F_.zf - F_.over], [xb, F_.eaveY, F_.zf - F_.over], [xb, F_.ridgeY, F_.ridgeZ], [xa, F_.ridgeY, F_.ridgeZ]]);
  pen.fill(rf(F_.x0 - F_.over, F_.x1 + F_.over), PAL.shingle);
  shingleLines(F_.x0 - F_.over, F_.x1 + F_.over, t);
  // re-draw the gable wall over the slope, with its own steep little roof
  const gab = Q3([[gx - gw, F_.eaveY, F_.zf], [gx + gw, F_.eaveY, F_.zf], [gx + gw, F_.eaveY + 0.3, F_.zf], [gx, gTop, F_.zf], [gx - gw, F_.eaveY + 0.3, F_.zf]]);
  pen.fill(gab, PAL.brick);
  // the gable's own roof edge: a thin band of shingle above the bargeboard
  pen.fill(Q3([[gx - gw - 0.3, F_.eaveY + 0.1, F_.zf - 0.3], [gx, gTop + 0.3, F_.zf - 0.3], [gx, gTop + 0.55, F_.zf - 0.25], [gx - gw - 0.45, F_.eaveY + 0.3, F_.zf - 0.25]]), PAL.shingle);
  pen.fill(Q3([[gx + gw + 0.3, F_.eaveY + 0.1, F_.zf - 0.3], [gx, gTop + 0.3, F_.zf - 0.3], [gx, gTop + 0.55, F_.zf - 0.25], [gx + gw + 0.45, F_.eaveY + 0.3, F_.zf - 0.25]]), PAL.shingle);
  // bargeboard: cream trim with a scalloped edge
  const bb = (a, b) => {
    const pts = []; for (let i = 0; i <= 14; i++) pts.push(vlerp(a, b, i / 14));
    pen.stroke(L3(pts), PAL.trim, Math.max(2, ppm(F_.zf) * 0.16));
    const sc = new Path2D();
    for (let i = 0; i < 14; i++) { const p = pj(...vlerp(a, b, (i + 0.5) / 14)); sc.addPath(ellipsePath(p[0], p[1] + ppm(F_.zf) * 0.12, ppm(F_.zf) * 0.07, ppm(F_.zf) * 0.07)); }
    pen.fill(sc, PAL.trim);
  };
  bb([gx - gw - 0.3, F_.eaveY + 0.1, F_.zf - 0.3], [gx, gTop + 0.3, F_.zf - 0.3]);
  bb([gx + gw + 0.3, F_.eaveY + 0.1, F_.zf - 0.3], [gx, gTop + 0.3, F_.zf - 0.3]);
  // lancet window in the gable
  const lw = 0.45, lb = 5.35, lt = 6.9, lz = F_.zf - 0.01;
  const arch = [];
  for (let i = 0; i <= 10; i++) { const a = i / 10 * Math.PI; arch.push([gx - lw * Math.cos(a), lt - 0.6 + Math.pow(Math.sin(a), 0.6) * 0.6, lz]); }
  const lancet = Q3([[gx - lw, lb, lz], [gx + lw, lb, lz]].concat(arch.reverse()).map(p => p));
  pen.fill(lancet, PAL.trim);
  const lancetIn = Q3([[gx - lw + 0.1, lb + 0.1, lz], [gx + lw - 0.1, lb + 0.1, lz]].concat(arch.map(([x, y, z]) => [gx + (x - gx) * 0.78, lb + 0.1 + (y - lb - 0.1) * 0.93, z])));
  pen.fill(lancetIn, cmix(PAL.glow, PAL.brickDk, 0.35 - 0.15 * smoother((t - 2) / 3)));
  pen.stroke(L3([[gx, lb + 0.1, lz], [gx, lt - 0.1, lz]]), PAL.trim, 1.4);
  // fascia/soffit along the front eave
  pen.fill(Q3([[F_.x0 - F_.over, F_.eaveY - 0.25, F_.zf - F_.over], [F_.x1 + F_.over, F_.eaveY - 0.25, F_.zf - F_.over], [F_.x1 + F_.over, F_.eaveY + 0.05, F_.zf - F_.over], [F_.x0 - F_.over, F_.eaveY + 0.05, F_.zf - F_.over]]), PAL.trim);
  // gable end roof edge (seam side) with its bargeboard
  bb([F_.x0 - F_.over, F_.eaveY, F_.zf - F_.over], [F_.x0 - F_.over, F_.ridgeY + 0.1, F_.ridgeZ]);
  // chimneys
  chimney(F_.x0 + 0.5, F_.ridgeZ, F_.ridgeY, t, true);
  chimney(F_.x1 - 0.5, F_.ridgeZ, F_.ridgeY, t, false);
  // ground-floor windows and door
  for (const x of [6.6, 8.2, 11.8, 13.4]) sashZ(x - 0.45, x + 0.45, 1.2, 3.0, F_.zf, t, 'w' + x);
  for (const x of [6.6, 8.2, 11.8, 13.4]) sashZ(x - 0.4, x + 0.4, 3.7, 4.6, F_.zf, t, 'u' + x, true);
  pen.fill(rectZ(gx - 0.55, gx + 0.55, 0.55, 3.0, F_.zf), PAL.trim);
  pen.fill(rectZ(gx - 0.42, gx + 0.42, 0.6, 2.85, F_.zf), cmix(PAL.shutter, PAL.wood, 0.3));
  pen.fill(rectZ(gx - 0.3, gx + 0.3, 2.3, 2.75, F_.zf), cmix(PAL.glow, PAL.brickDk, 0.2));
  // verandah
  const vz = F_.zf - 2.2, vy = 3.15;
  pen.fill(Q3([[F_.x0 + 0.5, 0.55, vz], [F_.x1 - 0.5, 0.55, vz], [F_.x1 - 0.5, 0.55, F_.zf], [F_.x0 + 0.5, 0.55, F_.zf]]), cmix(PAL.trim, PAL.woodLt, 0.4));
  pen.fill(rectZ(F_.x0 + 0.5, F_.x1 - 0.5, 0.25, 0.55, vz), PAL.trim);
  // porch roof and its shade on the wall
  pen.fill(Q3([[F_.x0 + 0.3, vy, vz - 0.2], [F_.x1 - 0.3, vy, vz - 0.2], [F_.x1 - 0.3, vy + 0.6, F_.zf], [F_.x0 + 0.3, vy + 0.6, F_.zf]]), PAL.shingle);
  pen.fill(Q3([[F_.x0 + 0.5, 0.55, F_.zf - 0.01], [F_.x1 - 0.5, 0.55, F_.zf - 0.01], [F_.x1 - 0.5, vy, F_.zf - 0.01], [F_.x0 + 0.5, vy, F_.zf - 0.01]]),
    { lin: [0, pj(0, vy, F_.zf)[1], 0, pj(0, 0.55, F_.zf)[1]], stops: [[0, PAL.shadow, 0.9], [1, PAL.shadow, 0.2]] }, 'add');
  pen.fill(rectZ(F_.x0 + 0.3, F_.x1 - 0.3, vy - 0.22, vy + 0.02, vz - 0.2), PAL.trim);
  // posts with brackets and a rail
  const posts = new Path2D(), brackets = new Path2D();
  for (let i = 0; i <= 4; i++) {
    const x = lerp(F_.x0 + 0.7, F_.x1 - 0.7, i / 4);
    posts.addPath(rectZ(x - 0.07, x + 0.07, 0.55, vy - 0.2, vz));
    for (const s of [-1, 1]) brackets.addPath(Q3([[x, vy - 0.22, vz], [x + s * 0.4, vy - 0.22, vz], [x + s * 0.05, vy - 0.6, vz]]));
  }
  pen.fill(posts, PAL.trim); pen.fill(brackets, PAL.trim);
  const rail = new Path2D();
  rail.addPath(rectZ(F_.x0 + 0.6, gx - 0.8, 1.35, 1.42, vz));
  rail.addPath(rectZ(gx + 0.8, F_.x1 - 0.6, 1.35, 1.42, vz));
  for (let x = F_.x0 + 0.8; x < F_.x1 - 0.6; x += 0.16) if (Math.abs(x - gx) > 0.8) rail.addPath(rectZ(x - 0.02, x + 0.02, 0.6, 1.36, vz));
  pen.fill(rail, PAL.trim);
  // backlight on the roof ridge and the gable edges facing the sun
  rimLine([[F_.x0 - F_.over, F_.ridgeY + 0.1, F_.ridgeZ], [F_.x1 + F_.over, F_.ridgeY + 0.1, F_.ridgeZ]], 2);
  rimLine([[F_.x0 - F_.over, F_.eaveY, F_.zf - F_.over], [F_.x0 - F_.over, F_.ridgeY + 0.1, F_.ridgeZ]], 1.8, 0.8);
  rimLine([[gx - gw - 0.3, F_.eaveY + 0.1, F_.zf - 0.3], [gx, gTop + 0.3, F_.zf - 0.3]], 1.6, 0.7);
}
function brickCourses(axis, c, a0, a1, y0, y1, key) {
  const p = new Path2D(), r = rngFor(key);
  for (let y = y0 + 0.3; y < y1; y += 0.3) {
    p.addPath(axis === 'z' ? L3([[a0, y, c], [a1, y, c]]) : L3([[c, y, a0], [c, y, a1]]));
  }
  pen.stroke(p, PAL.brickDk, 0.9, 'put', 0.45);
  // a few darker bricks for texture
  const b = new Path2D();
  for (let i = 0; i < 90; i++) {
    const u = lerp(a0, a1, r()), y = y0 + Math.floor(r() * (y1 - y0) / 0.3) * 0.3 + 0.15;
    b.addPath(axis === 'z' ? rectZ(u, u + 0.24, y - 0.1, y + 0.1, c) : rectX(c, u, u + 0.24, y - 0.1, y + 0.1));
  }
  pen.fill(b, cmix(PAL.brick, PAL.brickDk, 0.6), 'put', 0.7);
}
function shingleLines(x0, x1, t) {
  const p = new Path2D();
  for (let k = 1; k < 12; k++) {
    const u = k / 12, y = lerp(FH.eaveY, FH.ridgeY, u), z = lerp(FH.zf - FH.over, FH.ridgeZ, u);
    p.addPath(L3([[x0, y, z], [x1, y, z]]));
  }
  pen.stroke(p, cmix(PAL.shingle, PAL.shadow, 0.6), 0.9, 'put', 0.6);
}
function sashZ(x0, x1, y0, y1, z, t, key, upper) {
  pen.fill(rectZ(x0 - 0.08, x1 + 0.08, y0 - 0.1, y1 + 0.12, z - 0.01), PAL.trim);
  const lit = upper ? 0.35 : 0.85 * smoother((t - 1.4 - (key.length % 3) * 0.4) / 1.8) + 0.12;
  pen.fill(rectZ(x0, x1, y0, y1, z - 0.02), cmix(C(0.1, 0.2, 0.12, 0.3, 0.05, 0.45), PAL.glow, lit));
  const p = new Path2D();
  p.addPath(L3([[x0, (y0 + y1) / 2, z - 0.02], [x1, (y0 + y1) / 2, z - 0.02]]));
  p.addPath(L3([[(x0 + x1) / 2, y0, z - 0.02], [(x0 + x1) / 2, y1, z - 0.02]]));
  pen.stroke(p, PAL.trim, Math.max(1, ppm(z) * 0.05));
  if (!upper) { // shutters
    pen.fill(rectZ(x0 - 0.46, x0 - 0.1, y0, y1, z - 0.01), PAL.shutter);
    pen.fill(rectZ(x1 + 0.1, x1 + 0.46, y0, y1, z - 0.01), PAL.shutter);
  }
}
function sashX(x, z0, z1, y0, y1, t, key, upper) {
  pen.fill(rectX(x - 0.01, z0 - 0.1, z1 + 0.1, y0 - 0.1, y1 + 0.12), PAL.trim);
  const lit = upper ? 0.3 : 0.7 * smoother((t - 2.2) / 2) + 0.15;
  pen.fill(rectX(x - 0.02, z0, z1, y0, y1), cmix(C(0.1, 0.2, 0.12, 0.3, 0.05, 0.45), PAL.glow, lit));
  pen.stroke(L3([[x - 0.02, (y0 + y1) / 2, z0], [x - 0.02, (y0 + y1) / 2, z1]]), PAL.trim, 1.2);
}
function chimney(x, z, y, t, smokes) {
  const w = 0.35, top = y + 1.0;
  pen.fill(Q3([[x - w, y - 0.6, z - w], [x + w, y - 0.6, z - w], [x + w, top, z - w], [x - w, top, z - w]]), PAL.brickDk);
  pen.fill(Q3([[x - w, y - 0.6, z - w], [x - w, y - 0.6, z + w], [x - w, top, z + w], [x - w, top, z - w]]), cmix(PAL.brickDk, PAL.shadow, 0.3));
  pen.fill(rectZ(x - w - 0.06, x + w + 0.06, top - 0.12, top, z - w - 0.05), PAL.brickDk);
  rimLine([[x - w, top, z - w], [x + w, top, z - w]], 1.4, 0.7);
  if (smokes) smoke(t, [x, top + 0.2, z], 'chim', 1, 0.35);
}

/* ── trees ──────────────────────────────────────────────────────────────────── */
// canopy leaves as clusters in a volume; the wind moves each cluster
function leafCloud(key, cx, cy, cz, rx, ry, rz, n, t, cols, opts = {}) {
  const r = rngFor(key), groups = cols.map(() => new Path2D());
  const size = opts.size || 0.22, tiers = opts.tiers || 0;
  for (let i = 0; i < n; i++) {
    let u = r() * 2 - 1, v = r() * 2 - 1, w = r() * 2 - 1;
    if (u * u + v * v + w * w > 1) { i--; continue; }
    if (tiers) v = Math.round((v + 1) * tiers / 2) / (tiers / 2) - 1 + (r() - 0.5) * 0.25;
    const x = cx + u * rx, y = cy + v * ry, z = cz + w * rz;
    const sway = wz(key + (i % 7), t, 0.45, 0.06) * (0.3 + (v + 1) * 0.5);
    const p = pj(x + sway, y + sway * 0.3, z), s = ppm(z) * size * (0.6 + r() * 0.8);
    // light side: leaves toward the sun (and the top) are brighter
    const litK = clamp(0.5 + (opts.sunSide || 0) * u * 0.5 + v * 0.35 + (r() - 0.5) * 0.5, 0, 0.999);
    const gi = Math.floor(litK * cols.length);
    const ang = r() * Math.PI;
    groups[gi].addPath(ellipsePath(p[0], p[1], s, s * (0.55 + r() * 0.3), ang));
  }
  groups.forEach((g, i) => pen.fill(g, cols[i]));
}
function trunk(pts3, radii, col) {
  pen.fill(capsule(pts3, radii), col);
}
function drawMomiji(t) {    // Japanese maple: low, spreading, layered, fine red leaves
  const x = -4.75, z = 26;
  trunk([[x, 0, z], [x + 0.15, 1.3, z], [x - 0.35, 2.4, z]], [0.16, 0.12, 0.07], PAL.bark);
  trunk([[x + 0.15, 1.3, z], [x + 0.9, 2.3, z + 0.2]], [0.08, 0.05], PAL.bark);
